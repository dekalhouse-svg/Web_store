<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Formulaire campagne — WEB STORE Admin</title><link rel="stylesheet" href="../css/style.css">
<style>.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.field{min-width:0}.field.full{grid-column:1/-1}.field label{display:block;font-size:12px;color:var(--color-text-muted);margin-bottom:6px}.field input,.field select,.field textarea{width:100%;padding:10px;border:1px solid var(--color-border);border-radius:8px;background:var(--color-surface-alt);color:var(--color-text)}.field textarea{min-height:85px}.checks{display:flex;flex-wrap:wrap;gap:9px}.checks label{display:flex;align-items:center;gap:5px}.preview{display:none;width:100%;height:190px;object-fit:cover;border-radius:10px;margin-top:8px}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:16px}@media(max-width:650px){.form-grid{grid-template-columns:1fr}.field.full{grid-column:auto}}</style></head><body><div class="app-shell">
<aside class="sidebar" id="sidebar"><div class="sidebar-logo">WEB STORE<strong>ADMIN</strong></div><nav class="sidebar-nav"><a href="dashboard.html">Vue générale</a><a href="project-analytics.html">Performances projets</a><a href="category-relations.html">Catégories voisines</a><a href="visitor-analytics.html">Données visiteurs</a><a href="developers.html">Développeurs</a><a href="publications.html">Publications</a><a href="messages.html">Messages</a><a href="campaigns.html" class="active">Publicités</a><a href="profile.html">Profil</a></nav><div class="sidebar-footer"><button class="sidebar-logout" id="logoutBtn">Se déconnecter</button></div></aside>
<div class="content"><div class="topbar"><button class="menu-toggle" id="menuToggle">☰</button><div class="topbar-title" id="pageTitle">Créer une campagne</div><div></div></div><main class="page"><section class="card"><div class="card-header"><h2 id="formTitle">Informations de la campagne</h2></div><form id="form"><div class="form-grid">
<div class="field full"><label>Projet publié</label><select id="project" required></select></div>
<div class="field full"><label>Titre de la campagne</label><input id="title" maxlength="160" required></div>
<div class="field full"><label>Grande image promotionnelle</label><input id="image" type="file" accept="image/*"><small>L'image sera recadrée avec object-fit: cover sur la carte publique.</small><img id="preview" class="preview" alt="Aperçu"></div>
<div class="field full"><label>Catégories ciblées (aucune sélection = toutes)</label><div id="categories" class="checks"></div></div>
<div class="field"><label>Date et heure de début</label><input id="starts" type="datetime-local"></div><div class="field"><label>Date et heure de fin</label><input id="ends" type="datetime-local"></div>
<div class="field"><label>Statut du paiement</label><select id="payment"><option value="NON_PAYE">Non payé</option><option value="A_VERIFIER">À vérifier</option><option value="PAYE">Payé / confirmé</option><option value="REFUSE">Refusé</option></select></div>
<div class="field"><label>Statut de la campagne</label><select id="status"><option value="BROUILLON">Brouillon</option><option value="EN_ATTENTE">En attente</option><option value="ACTIVE">Active</option><option value="SUSPENDUE">Suspendue</option><option value="REJETEE">Rejetée</option><option value="TERMINEE">Terminée</option></select></div>
<div class="field full"><label>Note interne / tarif proposé / suivi du paiement</label><textarea id="note"></textarea></div></div><p id="message" role="status"></p><div class="actions"><button class="btn btn-primary" id="save" type="submit">Enregistrer la campagne</button><a class="btn" href="campaigns.html">Annuler / retour</a></div></form></section></main></div></div>
<script src="../js/config.js"></script><script src="../js/api.js"></script><script src="../js/auth.js"></script><script>
const $=id=>document.getElementById(id),params=new URLSearchParams(location.search),editId=Number(params.get('id')||0);let cats=[],campaign=null,imageData='';
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function local(v){if(!v)return'';const d=new Date(v),p=n=>String(n).padStart(2,'0');return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`}
function readImage(file){return new Promise((resolve,reject)=>{if(!file)return resolve('');if(!file.type.startsWith('image/'))return reject(Error('Choisissez une image.'));const r=new FileReader();r.onerror=()=>reject(Error('Lecture image impossible.'));r.onload=()=>{const im=new Image();im.onerror=()=>reject(Error('Image illisible.'));im.onload=()=>{const scale=Math.min(1,1440/im.width,900/im.height),c=document.createElement('canvas');c.width=Math.round(im.width*scale);c.height=Math.round(im.height*scale);c.getContext('2d').drawImage(im,0,0,c.width,c.height);resolve(c.toDataURL('image/jpeg',.8))};im.src=r.result};r.readAsDataURL(file)})}
$('image').onchange=async()=>{try{imageData=await readImage($('image').files[0]);$('preview').src=imageData;$('preview').style.display=imageData?'block':'none'}catch(e){$('message').textContent=e.message}};
async function init(){try{const [projects,allCats]=await Promise.all([WebStoreAdminAPI.getPublications({status:'PUBLIE'}),WebStoreAdminAPI.getCategories()]);cats=allCats;$('project').innerHTML=projects.filter(p=>p.status==='PUBLIE').map(p=>`<option value="${p.id}">${esc(p.name)} — ${esc(p.developer_name)}</option>`).join('');$('categories').innerHTML=cats.map(c=>`<label><input type="checkbox" value="${esc(c.name)}"> ${esc(c.name)}</label>`).join('');if(editId){$('pageTitle').textContent='Modifier une campagne';$('formTitle').textContent='Modifier les informations';campaign=(await WebStoreAdminAPI.getSponsoredCampaigns()).find(c=>c.id===editId);if(!campaign)throw Error('Campagne introuvable.');$('project').value=campaign.project_id;$('title').value=campaign.title;$('starts').value=local(campaign.starts_at);$('ends').value=local(campaign.ends_at);$('payment').value=campaign.payment_status;$('status').value=campaign.status;$('note').value=campaign.admin_note||'';$('categories').querySelectorAll('input').forEach(x=>x.checked=(campaign.target_categories||[]).includes(x.value));if(campaign.image_data||campaign.image_url){$('preview').src=campaign.image_data||campaign.image_url;$('preview').style.display='block'}}else if(!projects.length){throw Error('Aucun projet publié disponible.')}}catch(e){$('message').textContent=e.message}}
$('form').onsubmit=async e=>{e.preventDefault();$('save').disabled=true;$('message').textContent='Enregistrement…';try{const selected=[...$('categories').querySelectorAll('input:checked')].map(x=>x.value),payload={project_id:Number($('project').value),title:$('title').value.trim(),target_categories:selected,starts_at:$('starts').value||null,ends_at:$('ends').value||null,payment_status:$('payment').value,status:$('status').value,admin_note:$('note').value};if(imageData)payload.image_data=imageData;if(!editId){const created=await WebStoreAdminAPI.createSponsoredCampaign({project_id:payload.project_id,title:payload.title,target_categories:selected,image_data:imageData});await WebStoreAdminAPI.updateSponsoredCampaign(created.id,payload)}else await WebStoreAdminAPI.updateSponsoredCampaign(editId,payload);$('message').textContent='Campagne enregistrée.';setTimeout(()=>location.href='campaigns.html',600)}catch(err){$('message').textContent=err.message}finally{$('save').disabled=false}};
init();
</script></body></html>
