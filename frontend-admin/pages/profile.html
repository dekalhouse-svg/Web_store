<!DOCTYPE html>
<html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mon profil — WEB STORE Admin</title><meta name="theme-color" content="#0B0B0F"><link rel="manifest" href="../manifest.json"><link rel="icon" href="../icons/icon-192.png"><link rel="stylesheet" href="../css/style.css"></head>
<body><div class="app-shell"><aside class="sidebar" id="sidebar"><div class="sidebar-logo">WEB STORE<strong>ADMIN</strong></div><nav class="sidebar-nav"><a href="dashboard.html">Vue générale</a><a href="developers.html">Développeurs</a><a href="publications.html">Publications</a><a href="profile.html" class="active">Profil</a></nav><div class="sidebar-footer"><button class="sidebar-logout" id="logoutBtn">Se déconnecter</button></div></aside>
<div class="content"><div class="topbar"><button class="menu-toggle" id="menuToggle">☰</button><div class="topbar-title">Mon profil</div><div></div></div><div class="page">
<div class="card"><div class="card-header"><h2>Mes informations</h2><button class="btn" id="editBtn" type="button">Modifier</button></div><div id="profileInfo" class="empty-state">Chargement du profil…</div></div>
<div class="card" id="editCard" hidden><div class="card-header"><h2>Modifier le mot de passe</h2></div><div id="formMessage"></div><form id="passwordForm"><div class="field"><label for="current_password">Mot de passe actuel</label><input id="current_password" type="password" autocomplete="current-password" required></div><div class="field"><label for="new_password">Nouveau mot de passe (8 caractères minimum)</label><input id="new_password" type="password" minlength="8" autocomplete="new-password" required></div><div class="field"><label for="confirm_password">Confirmer le nouveau mot de passe</label><input id="confirm_password" type="password" minlength="8" autocomplete="new-password" required></div><button class="btn" type="submit" id="saveBtn">Enregistrer le nouveau mot de passe</button></form></div>
</div></div></div>
<script src="../js/config.js"></script><script src="../js/api.js"></script><script src="../js/auth.js"></script><script>
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
document.getElementById("editBtn").addEventListener("click",()=>{document.getElementById("editCard").hidden=false;document.getElementById("editCard").scrollIntoView({behavior:"smooth"});});
(async()=>{try{const u=await WebStoreAdminAPI.getMe();document.getElementById("profileInfo").className="";document.getElementById("profileInfo").innerHTML=`<p><strong>Nom complet :</strong> ${esc(u.full_name||"Non renseigné")}</p><p><strong>Nom d'utilisateur :</strong> ${esc(u.username||"Non renseigné")}</p><p><strong>E-mail :</strong> ${esc(u.email)}</p><p><strong>Type de compte :</strong> Administrateur</p>`;}catch(e){document.getElementById("profileInfo").textContent="Impossible de charger le profil : "+e.message;}})();
document.getElementById("passwordForm").addEventListener("submit",async e=>{e.preventDefault();const box=document.getElementById("formMessage"),btn=document.getElementById("saveBtn");box.textContent="";btn.disabled=true;try{const result=await WebStoreAdminAPI.changePassword({current_password:document.getElementById("current_password").value,new_password:document.getElementById("new_password").value,confirm_password:document.getElementById("confirm_password").value});box.innerHTML=`<div class="form-message">${esc(result.message)}</div>`;WebStoreAdminAPI.logout();setTimeout(()=>location.href="login.html",1300);}catch(err){box.innerHTML=`<div class="form-message error">${esc(err.message)}</div>`;btn.disabled=false;}});
</script></body></html>
