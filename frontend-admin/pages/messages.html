<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Messages | WEB STORE Admin</title>
  <link rel="stylesheet" href="../css/style.css">
  <style>
    .messages-layout{display:grid;grid-template-columns:minmax(230px, .8fr) minmax(280px,1.2fr);gap:16px}.message-row{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid #e5e7eb;background:#fff;padding:13px;cursor:pointer;color:inherit}.message-row.unread{background:#f0fdf4;font-weight:600}.message-row small{display:block;color:#64748b;font-weight:400;margin-top:5px}.message-content{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.6}.message-actions{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.message-actions button,.reply-form button{cursor:pointer}.reply-form textarea{width:100%;min-height:100px;box-sizing:border-box}.tab-button{padding:8px 12px;margin:0 6px 12px 0}.tab-button.active{font-weight:700;border:2px solid #16a34a}@media(max-width:760px){.messages-layout{grid-template-columns:1fr}}
  </style>
</head>
<body>
<div class="app-shell">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-brand">WEB STORE <small>Administration</small></div>
    <nav class="sidebar-nav">
      <a href="dashboard.html">Vue générale</a><a href="developers.html">Développeurs</a><a href="publications.html">Publications</a>
    </nav>
    <div class="sidebar-footer"><button id="logoutBtn" type="button">Déconnexion</button></div>
  </aside>
  <main class="main-content">
    <header class="topbar"><button id="menuToggle" type="button" aria-label="Ouvrir le menu">☰</button><div class="topbar-title">Messages</div></header>
    <div class="page-content">
      <div class="message-actions"><button class="tab-button active" id="inboxTab" type="button">Boîte de réception</button><button class="tab-button" id="sentTab" type="button">Messages envoyés</button><button type="button" id="refreshBtn">Actualiser</button></div>
      <p id="status" role="status" aria-live="polite"></p>
      <div class="messages-layout">
        <section class="card"><h2 id="listTitle">Boîte de réception</h2><div id="messageList">Chargement des messages…</div></section>
        <section class="card" id="detailPanel"><h2 id="detailSubject">Sélectionnez un message</h2><p id="detailMeta"></p><div id="detailContent" class="message-content">Les messages apparaîtront ici.</div><form id="replyForm" class="reply-form" hidden><label for="replyContent">Répondre</label><textarea id="replyContent" maxlength="10000" required></textarea><button type="submit">Envoyer la réponse</button></form></section>
      </div>
    </div>
  </main>
</div>
<script src="../js/config.js"></script><script src="../js/api.js"></script><script src="../js/auth.js"></script>
<script>
let box = "inbox", selectedId = null, messages = [];
const $ = id => document.getElementById(id);
function setStatus(text){ $("status").textContent = text || ""; }
function fmt(value){ try{return new Date(value).toLocaleString("fr-FR");}catch(_){return "";} }
async function loadMessages(){
  $("messageList").textContent = "Chargement…";
  try { messages = await WebStoreAdminAPI.getMessages(box); renderList(); setStatus(messages.length ? `${messages.length} message(s).` : "Aucun message."); }
  catch(e){ $("messageList").textContent = "Impossible de charger les messages."; setStatus(e.message); }
}
function renderList(){
  const list = $("messageList"); list.replaceChildren();
  if(!messages.length){list.textContent="Aucun message.";return;}
  for(const m of messages){ const b=document.createElement("button"); b.type="button"; b.className="message-row"+(box==="inbox"&&!m.read?" unread":"");
    const title=document.createElement("span"); title.textContent=m.subject||"(Sans sujet)";
    const meta=document.createElement("small"); meta.textContent=`${box==="inbox"?(m.sender_name||"Expéditeur"):(m.recipient_name||"Destinataire")} · ${fmt(m.created_at)}${box==="inbox"&&!m.read?" · Non lu":""}`;
    b.append(title,meta); b.addEventListener("click",()=>openMessage(m.id)); list.appendChild(b); }
}
async function openMessage(id){
  try{ const m=await WebStoreAdminAPI.getMessage(id); selectedId=id; $("detailSubject").textContent=m.subject||"(Sans sujet)"; $("detailMeta").textContent=`${m.sender_name||"Expéditeur"} (${m.sender_email||""}) · ${fmt(m.created_at)}`; $("detailContent").textContent=m.content||"";
    $("replyForm").hidden=box!=="inbox"; $("replyContent").value="";
    if(box==="inbox"&&!m.read){await WebStoreAdminAPI.markMessageRead(id); await loadMessages();}
  }catch(e){setStatus(e.message||"Impossible d'ouvrir ce message.");}
}
function selectBox(next){box=next;selectedId=null;$("inboxTab").classList.toggle("active",box==="inbox");$("sentTab").classList.toggle("active",box==="sent");$("listTitle").textContent=box==="inbox"?"Boîte de réception":"Messages envoyés";$("detailSubject").textContent="Sélectionnez un message";$("detailMeta").textContent="";$("detailContent").textContent="Les messages apparaîtront ici.";$("replyForm").hidden=true;loadMessages();}
$("inboxTab").addEventListener("click",()=>selectBox("inbox"));$("sentTab").addEventListener("click",()=>selectBox("sent"));$("refreshBtn").addEventListener("click",loadMessages);
$("replyForm").addEventListener("submit",async e=>{e.preventDefault();const content=$("replyContent").value.trim();if(!content||!selectedId)return;const button=e.submitter||$("replyForm").querySelector("button");button.disabled=true;try{await WebStoreAdminAPI.replyToMessage(selectedId,content);$("replyContent").value="";setStatus("Réponse envoyée.");await loadMessages();}catch(err){setStatus(err.message||"Échec de l'envoi.");}finally{button.disabled=false;}});
loadMessages();
</script>
</body></html>
