<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Publication — WEB STORE Admin</title>
<meta name="theme-color" content="#0B0B0F">
<link rel="manifest" href="../manifest.json">
<link rel="icon" href="../icons/icon-192.png">
<link rel="stylesheet" href="../css/style.css">
</head>
<body>
<div class="app-shell">

  <aside class="sidebar" id="sidebar">
    <div class="sidebar-logo">WEB STORE<strong>ADMIN</strong></div>
    <nav class="sidebar-nav">
      <a href="dashboard.html">Vue générale</a>
      <a href="developers.html">Développeurs</a>
      <a href="publications.html" class="active">Publications</a>
    </nav>
    <div class="sidebar-footer">
      <button class="sidebar-logout" id="logoutBtn">Se déconnecter</button>
    </div>
  </aside>

  <div class="content">
    <div class="topbar">
      <button class="menu-toggle" id="menuToggle">☰</button>
      <div class="topbar-title" id="pageTitle">Publication</div>
      <div></div>
    </div>

    <div class="page">

      <div class="card" id="publicationCard">
        <p>Chargement…</p>
      </div>

      <div class="card">
        <div class="card-header"><h2>Commentaires</h2></div>
        <div id="commentsList" class="empty-state">Aucun commentaire.</div>
      </div>

      <div class="card">
        <div class="card-header"><h2>Signalements</h2></div>
        <div id="reportsList" class="empty-state">Aucun signalement.</div>
      </div>

    </div>
  </div>
</div>

<script src="../js/config.js"></script>
<script src="../js/api.js"></script>
<script src="../js/auth.js"></script>
<script>
  const publicationId = new URLSearchParams(window.location.search).get("id");
  loadPublication();

  async function loadPublication() {
    if (!publicationId) return;
    try {
      const project = await WebStoreAdminAPI.getPublication(publicationId);
      render(project);
    } catch (err) {
      document.getElementById("publicationCard").innerHTML = `<p>Impossible de charger cette publication.</p>`;
    }
  }

  function render(project) {
    document.getElementById("pageTitle").textContent = project.name;

    document.getElementById("publicationCard").innerHTML = `
      <div class="detail-grid" style="grid-template-columns: repeat(auto-fit, minmax(160px,1fr));">
        <div><div class="detail-label">Développeur</div><div class="detail-value">
          <a class="link-action" href="developer-detail.html?id=${project.developer_id}">${escapeHtml(project.developer_name)}</a>
        </div></div>
        <div><div class="detail-label">Type</div><div class="detail-value">${escapeHtml(project.type === "PWA" ? "PWA" : "WEB")}</div></div>
        <div><div class="detail-label">Catégorie</div><div class="detail-value">${escapeHtml(project.category || "—")}</div></div>
        <div><div class="detail-label">Statut</div><div class="detail-value"><span class="status-pill status-${safeProjectStatus(project.status)}">${escapeHtml(project.status)}</span></div></div>
        <div><div class="detail-label">À la une</div><div class="detail-value">${project.featured ? "Oui" : "Non"}</div></div>
      </div>

      <div class="stat-grid" style="margin-top:18px;">
        <div class="stat-card"><div class="value">${project.stats?.comments ?? 0}</div><div class="label">Commentaires</div></div>
        <div class="stat-card"><div class="value">${project.stats?.visits ?? 0}</div><div class="label">Visites</div></div>
        ${project.type === "PWA" ? `<div class="stat-card"><div class="value">${project.stats?.downloads ?? 0}</div><div class="label">Téléchargements / installations PWA</div></div>` : ""}
      </div>

      <div style="margin-top:16px;">
        <div class="detail-label">URL</div>
        <div class="detail-value"><a id="projectExternalLink" href="#" target="_blank" rel="noopener noreferrer" class="link-action">${escapeHtml(project.url)}</a></div>
      </div>

      <div style="margin-top:16px;">
        <div class="detail-label">Description</div>
        <p style="font-size:13px; margin-top:4px; color: var(--color-text-muted); line-height:1.6;">${escapeHtml(project.description || "")}</p>
      </div>

      ${project.rejection_reason ? `<div class="reason-box"><strong>Motif de rejet :</strong> ${escapeHtml(project.rejection_reason)}</div>` : ""}
      ${project.suspension_reason ? `<div class="reason-box"><strong>Motif de suspension :</strong> ${escapeHtml(project.suspension_reason)}</div>` : ""}

      <div class="toolbar" style="margin-top:18px;">
        ${project.status === "EN_ATTENTE" ? `
          <button class="btn btn-success btn-inline" id="approveBtn">Approuver</button>
          <button class="btn btn-danger btn-inline" id="rejectBtn">Rejeter</button>
        ` : ""}
        ${project.status === "PUBLIE" ? `<button class="btn btn-warning btn-inline" id="suspendBtn">Suspendre</button>` : ""}
        ${project.status === "SUSPENDU" ? `<button class="btn btn-success btn-inline" id="approveBtn">Republier</button>` : ""}
        <button class="btn btn-outline btn-inline" id="featuredBtn">${project.featured ? "Retirer de la une" : "Mettre à la une"}</button>
        <button class="btn btn-outline btn-inline" id="deleteBtn">Supprimer</button>
      </div>
    `;

    const externalLink = document.getElementById("projectExternalLink");
    const safeProjectUrl = safeExternalUrl(project.url);
    if (safeProjectUrl) {
      externalLink.href = safeProjectUrl;
    } else {
      externalLink.removeAttribute("href");
      externalLink.removeAttribute("target");
      externalLink.setAttribute("aria-disabled", "true");
      externalLink.textContent = `${project.url || "Adresse invalide"} (lien désactivé)`;
    }

    document.getElementById("featuredBtn")?.addEventListener("click", async () => {
      await WebStoreAdminAPI.setFeatured(publicationId, !project.featured);
      loadPublication();
    });

    document.getElementById("approveBtn")?.addEventListener("click", async () => {
      await WebStoreAdminAPI.approvePublication(publicationId);
      loadPublication();
    });

    document.getElementById("rejectBtn")?.addEventListener("click", async () => {
      const reason = prompt("Motif du rejet (visible par le développeur) :");
      if (!reason) return;
      await WebStoreAdminAPI.rejectPublication(publicationId, reason);
      loadPublication();
    });

    document.getElementById("suspendBtn")?.addEventListener("click", async () => {
      const reason = prompt("Motif de la suspension (visible par le développeur) :");
      if (!reason) return;
      await WebStoreAdminAPI.suspendPublication(publicationId, reason);
      loadPublication();
    });

    document.getElementById("deleteBtn")?.addEventListener("click", async () => {
      const reason = prompt("Motif de la suppression (enregistré) :");
      if (!reason) return;
      if (!confirm("Supprimer définitivement cette publication ?")) return;
      await WebStoreAdminAPI.deletePublication(publicationId, reason);
      window.location.href = "publications.html";
    });

    renderComments(project.comments || []);
    renderReports(project.reports || [], project.comment_reports || []);
  }

  function renderComments(comments) {
    const list = document.getElementById("commentsList");
    list.replaceChildren();
    if (comments.length === 0) {
      list.className = "empty-state";
      list.textContent = "Aucun commentaire.";
      return;
    }
    list.className = "";
    comments.forEach((comment) => {
      const row = document.createElement("div");
      row.style.cssText = "padding:8px 0; border-bottom:1px solid var(--color-border); font-size:13px;";
      const author = document.createElement("strong");
      author.textContent = comment.author_name + (comment.is_hidden ? " — MASQUÉ (signalé)" : "");
      const content = document.createElement("p");
      content.style.whiteSpace = "pre-wrap";
      content.textContent = comment.content;
      const remove = document.createElement("button");
      remove.type = "button";
      remove.className = "btn btn-danger btn-inline";
      remove.style.cssText = "width:auto; margin-top:8px; padding:6px 10px; font-size:11px;";
      remove.textContent = "Supprimer ce commentaire";
      remove.addEventListener("click", async () => {
        if (!confirm("Supprimer définitivement ce commentaire ?")) return;
        remove.disabled = true;
        try {
          await WebStoreAdminAPI.deleteComment(comment.id);
          await loadPublication();
        } catch (_) {
          remove.disabled = false;
          alert("Impossible de supprimer ce commentaire.");
        }
      });
      row.append(author, content);
      if (comment.is_hidden) {
        const restore = document.createElement("button");
        restore.type = "button";
        restore.className = "btn btn-success btn-inline";
        restore.style.cssText = "width:auto;margin:8px 6px 0 0;padding:6px 10px;font-size:11px;";
        restore.textContent = "Réafficher après vérification";
        restore.addEventListener("click", async () => {
          if (!confirm("Réafficher ce commentaire ?")) return;
          restore.disabled = true;
          try { await WebStoreAdminAPI.restoreComment(comment.id); await loadPublication(); }
          catch (_) { restore.disabled = false; alert("Impossible de réafficher ce commentaire."); }
        });
        row.append(restore);
      }
      row.append(remove);
      list.appendChild(row);
    });
  }

  function renderReports(reports, commentReports) {
    const list = document.getElementById("reportsList");
    const projectItems = reports.map((r) => `<div style="padding:8px 0;border-bottom:1px solid var(--color-border);font-size:13px;"><strong>Publication :</strong> ${escapeHtml(r.reason)} — ${escapeHtml(r.description || "")}</div>`);
    const commentItems = commentReports.map((r) => `<div style="padding:8px 0;border-bottom:1px solid var(--color-border);font-size:13px;"><strong>Commentaire signalé (${escapeHtml(r.comment_author)}) :</strong> ${escapeHtml(r.reason)} — ${escapeHtml(r.description || "")}<div style="color:var(--color-text-muted);margin-top:4px;">Le commentaire est masqué en attendant votre décision.</div></div>`);
    const items = [...projectItems, ...commentItems];
    if (!items.length) { list.className = "empty-state"; list.textContent = "Aucun signalement."; return; }
    list.className = "";
    list.innerHTML = items.join("");
  }

  function safeProjectStatus(status) {
    return ["BROUILLON", "EN_ATTENTE", "PUBLIE", "REJETE", "SUSPENDU"].includes(status) ? status : "BROUILLON";
  }

  function safeExternalUrl(value) {
    try {
      const url = new URL(String(value || ""));
      return ["http:", "https:"].includes(url.protocol) ? url.href : "";
    } catch (_) {
      return "";
    }
  }

  function escapeHtml(value) {
    const div = document.createElement("div");
    div.textContent = value;
    return div.innerHTML;
  }
</script>
</body>
</html>
