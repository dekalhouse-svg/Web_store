<!DOCTYPE html>
<html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Publicités — WEB STORE Admin</title><link rel="stylesheet" href="../css/style.css">
<style>
.campaign-list{display:grid;gap:9px}.campaign-row{border:1px solid var(--color-border);border-radius:11px;padding:12px;background:var(--color-surface-alt)}.campaign-summary{display:flex;justify-content:space-between;align-items:center;gap:10px}.campaign-summary h3{font-size:14px;margin:0}.campaign-sub{font-size:11px;color:var(--color-text-muted);margin-top:4px}.campaign-tools{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.campaign-tools button,.campaign-tools a{border:1px solid var(--color-border);border-radius:8px;padding:7px 10px;background:var(--color-surface);color:var(--color-text);font-size:12px;text-decoration:none}.campaign-tools .danger{color:#dc2626}.campaign-detail{margin-top:10px;border-top:1px solid var(--color-border);padding-top:9px;font-size:12px;color:var(--color-text-muted)}.campaign-detail[hidden]{display:none}.campaign-top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.campaign-top a{display:inline-block;padding:10px 13px;background:var(--color-accent);color:white;text-decoration:none;border-radius:9px;font-size:13px}
</style></head><body><div class="app-shell">
<aside class="sidebar" id="sidebar"><div class="sidebar-logo">WEB STORE<strong>ADMIN</strong></div><nav class="sidebar-nav">
<a href="dashboard.html">Vue générale</a><a href="project-analytics.html">Performances projets</a><a href="category-relations.html">Catégories voisines</a><a href="visitor-analytics.html">Données visiteurs</a><a href="developers.html">Développeurs</a><a href="publications.html">Publications</a><a href="messages.html">Messages</a><a href="campaigns.html" class="active">Publicités</a><a href="profile.html">Profil</a></nav><div class="sidebar-footer"><button class="sidebar-logout" id="logoutBtn">Se déconnecter</button></div></aside>
<div class="content"><div class="topbar"><button class="menu-toggle" id="menuToggle">☰</button><div class="topbar-title">Publicités</div><div></div></div><main class="page">
<section class="card"><div class="campaign-top"><div><h2>Campagnes publicitaires</h2><p style="font-size:12px;color:var(--color-text-muted)">Consultez et gérez les campagnes sponsorisées.</p></div><a href="campaign-form.html">+ Créer une campagne</a></div></section>
<section class="card"><div class="card-header"><h2>Campagnes enregistrées</h2><select id="statusFilter" class="search-input"><option value="">Tous les statuts</option><option value="BROUILLON">Brouillons</option><option value="EN_ATTENTE">En attente</option><option value="ACTIVE">Actives</option><option value="SUSPENDUE">Suspendues</option><option value="REJETEE">Rejetées</option><option value="TERMINEE">Terminées</option></select></div><div id="campaignList" class="campaign-list">Chargement…</div><p id="listMessage" role="status"></p></section>
</main></div></div><script src="../js/config.js"></script><script src="../js/api.js"></script><script src="../js/auth.js"></script>
<script>
const $=id=>document.getElementById(id),esc=v=>{const e=document.createElement('span');e.textContent=String(v??'');return e.innerHTML};
async function load(){const root=$('campaignList');root.textContent='Chargement…';try{const list=await WebStoreAdminAPI.getSponsoredCampaigns($('statusFilter').value);if(!list.length){root.textContent='Aucune campagne enregistrée.';return}root.innerHTML=list.map(c=>`<article class="campaign-row" data-id="${c.id}"><div class="campaign-summary"><div><h3>${esc(c.title)}</h3><div class="campaign-sub">${esc(c.project_name)} · ${esc(c.developer)}</div></div><strong>${esc(c.status)}</strong></div><div class="campaign-sub">Paiement : ${esc(c.payment_status)} · ${c.impressions||0} impressions · ${c.clicks||0} clics</div><div class="campaign-tools"><a href="campaign-form.html?id=${c.id}">Modifier / détails</a><button type="button" data-details>Afficher les détails</button><button type="button" class="danger" data-delete>Supprimer</button></div><div class="campaign-detail" hidden>Projet : ${esc(c.project_name)}<br>Développeur : ${esc(c.developer)}<br>Catégories : ${esc((c.target_categories||[]).join(', ')||'Toutes')}<br>Début : ${esc(c.starts_at||'Non défini')}<br>Fin : ${esc(c.ends_at||'Non définie')}<br>Créée le : ${esc(c.created_at||'')}</div></article>`).join('');root.querySelectorAll('[data-details]').forEach(b=>b.onclick=()=>{const d=b.closest('[data-id]').querySelector('.campaign-detail');d.hidden=!d.hidden;b.textContent=d.hidden?'Afficher les détails':'Masquer les détails'});root.querySelectorAll('[data-delete]').forEach(b=>b.onclick=async()=>{const card=b.closest('[data-id]');if(!confirm('Supprimer définitivement cette campagne ?'))return;b.disabled=true;try{await WebStoreAdminAPI.deleteSponsoredCampaign(Number(card.dataset.id));card.remove();if(!root.children.length)root.textContent='Aucune campagne enregistrée.'}catch(e){alert(e.message);b.disabled=false}})}catch(e){root.textContent='Erreur API : '+e.message}}
$('statusFilter').addEventListener('change',load);load();
</script></body></html>
