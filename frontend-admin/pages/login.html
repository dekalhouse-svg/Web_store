<!DOCTYPE html>
<html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Connexion administration — WEB STORE</title><meta name="theme-color" content="#0B0B0F"><link rel="manifest" href="../manifest.json"><link rel="icon" href="../icons/icon-192.png"><link rel="stylesheet" href="../css/style.css">
<style>
.password-input-wrap{position:relative;width:100%;display:block}
.password-input-wrap input[type="password"],
.password-input-wrap input[type="text"]{box-sizing:border-box;width:100%;padding-right:48px!important}
.password-toggle{position:absolute;top:50%;right:8px;transform:translateY(-50%);width:34px;height:34px;padding:0;border:0;border-radius:7px;background:transparent;color:#64748b;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;z-index:2}
.password-toggle:hover{background:rgba(100,116,139,.10);color:#1e293b}
.password-toggle:focus-visible{outline:2px solid #64748b;outline-offset:1px}
.password-toggle svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.password-toggle .password-eye-hide{display:none}
.password-toggle[aria-pressed="true"] .password-eye-show{display:none}
.password-toggle[aria-pressed="true"] .password-eye-hide{display:block}
</style>
</head>
<body><div class="auth-wrap"><div class="auth-card"><div class="auth-logo">WEB STORE <strong>ADMINISTRATION</strong></div><h1 id="authTitle">Connexion</h1><p class="subtitle" id="authSubtitle">Accès réservé à l'équipe d'administration.</p><div id="formMessage" aria-live="polite"></div>
<form id="loginForm"><div class="field"><label for="email">E-mail</label><input type="email" id="email" autocomplete="username" required></div><div class="field"><label for="password">Mot de passe</label><div class="password-input-wrap"><input type="password" id="password" autocomplete="current-password" required><button class="password-toggle" type="button" aria-label="Afficher le mot de passe" aria-pressed="false" title="Afficher le mot de passe">
<svg class="password-eye-show" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>
<svg class="password-eye-hide" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="m3 3 18 18M10.6 10.6a2 2 0 0 0 2.8 2.8"/><path d="M9.9 5.2A10.8 10.8 0 0 1 12 5c6.4 0 10 7 10 7a16 16 0 0 1-3.1 3.8M6.2 6.2C3.5 8 2 12 2 12s3.6 7 10 7a10 10 0 0 0 4-.8"/></svg>
</button></div></div><button type="submit" class="btn" id="submitBtn">Continuer</button></form>
<div id="mfaPanel" hidden><p class="subtitle">Confirmez votre identité avec une clé biométrique déjà enregistrée sur votre compte.</p><button type="button" class="btn" id="biometricBtn">Utiliser mon empreinte / visage</button><button type="button" class="btn btn-secondary" id="fallbackBtn" hidden>Utiliser le code e-mail de secours</button><div id="fallbackPanel" hidden><div class="field"><label for="fallbackCode">Code reçu par e-mail</label><input id="fallbackCode" inputmode="numeric" autocomplete="one-time-code" maxlength="6"></div><button type="button" class="btn" id="verifyCodeBtn">Vérifier le code</button></div></div>
</div></div><script src="../js/config.js"></script><script src="../js/api.js"></script><script>
const $=id=>document.getElementById(id);let mfaToken="", publicKeyOptions=null;
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function message(text,error=true){$('formMessage').innerHTML=`<div class="form-message${error?' error':''}">${esc(text)}</div>`;}
function fromB64url(value){const s=value.replace(/-/g,'+').replace(/_/g,'/');const raw=atob(s+'='.repeat((4-s.length%4)%4));return Uint8Array.from(raw,c=>c.charCodeAt(0));}
function toB64url(buffer){return btoa(String.fromCharCode(...new Uint8Array(buffer))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');}
function credentialJSON(credential){if(credential.toJSON)return credential.toJSON();const r=credential.response;const out={id:credential.id,rawId:toB64url(credential.rawId),type:credential.type,authenticatorAttachment:credential.authenticatorAttachment,clientExtensionResults:credential.getClientExtensionResults(),response:{clientDataJSON:toB64url(r.clientDataJSON),authenticatorData:toB64url(r.authenticatorData),signature:toB64url(r.signature)}};if(r.userHandle)out.response.userHandle=toB64url(r.userHandle);return out;}
function decodeOptions(options){const o={...options,challenge:fromB64url(options.challenge)};if(options.allowCredentials)o.allowCredentials=options.allowCredentials.map(c=>({...c,id:fromB64url(c.id)}));return o;}
$('loginForm').addEventListener('submit',async e=>{e.preventDefault();$('submitBtn').disabled=true;$('formMessage').innerHTML='';try{const data=await WebStoreAdminAPI.login({email:$('email').value.trim(),password:$('password').value});if(data.mfa_required){mfaToken=data.mfa_token;publicKeyOptions=data.options;$('loginForm').hidden=true;$('mfaPanel').hidden=false;$('authTitle').textContent='Vérification de sécurité';$('authSubtitle').textContent='Une deuxième vérification est nécessaire pour accéder à l’administration.';let platformReady=false;if(!data.email_only){try{platformReady=!!(window.PublicKeyCredential&&await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable());}catch(_){}}$('biometricBtn').hidden=!platformReady;$('fallbackBtn').hidden=platformReady;if(!platformReady)message('Aucun authentificateur intégré compatible détecté. Utilisez le code e-mail de secours.',false);return;}location.href='dashboard.html';}catch(err){message(err.message||'Identifiants invalides.');$('submitBtn').disabled=false;}});
$('biometricBtn').addEventListener('click',async()=>{const btn=$('biometricBtn');btn.disabled=true;try{if(!window.PublicKeyCredential||!navigator.credentials)throw new Error('La biométrie WebAuthn n’est pas disponible dans ce navigateur. Utilisez le code e-mail de secours.');const assertion=await navigator.credentials.get({publicKey:decodeOptions(publicKeyOptions)});await WebStoreAdminAPI.completePasskeyLogin(mfaToken,credentialJSON(assertion));location.href='dashboard.html';}catch(err){message(err.name==='NotAllowedError'?'Vérification annulée ou impossible. Vous pouvez utiliser le code e-mail de secours.':err.message||'Échec de la vérification.');$('fallbackBtn').hidden=false;}finally{btn.disabled=false;}});
$('fallbackBtn').addEventListener('click',async()=>{const btn=$('fallbackBtn');btn.disabled=true;try{const r=await WebStoreAdminAPI.sendMfaFallback(mfaToken);$('fallbackPanel').hidden=false;message(r.message,false);}catch(err){message(err.message);}finally{btn.disabled=false;}});
$('verifyCodeBtn').addEventListener('click',async()=>{const btn=$('verifyCodeBtn');btn.disabled=true;try{await WebStoreAdminAPI.verifyMfaFallback(mfaToken,$('fallbackCode').value.trim());location.href='dashboard.html';}catch(err){message(err.message);}finally{btn.disabled=false;}});
</script>
<script>
document.querySelectorAll(".password-input-wrap").forEach((wrap) => {
  const input = wrap.querySelector("input");
  const button = wrap.querySelector(".password-toggle");
  if (!input || !button) return;

  button.addEventListener("click", () => {
    const willShow = input.type === "password";
    input.type = willShow ? "text" : "password";
    button.setAttribute("aria-pressed", String(willShow));
    button.setAttribute("aria-label", willShow ? "Masquer le mot de passe" : "Afficher le mot de passe");
    button.setAttribute("title", willShow ? "Masquer le mot de passe" : "Afficher le mot de passe");
    input.focus();
  });
});
</script>
</body></html>
