<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Catégories — WEB STORE</title>
<link rel="stylesheet" href="../css/style.css">
<style>
  #webstoreLoadingFrame { position:fixed; inset:0; width:100%; height:100%; border:0; z-index:99999; background:#fff; opacity:1; visibility:visible; transition:opacity .35s ease, visibility .35s ease; }
  #webstoreLoadingFrame.is-hidden { opacity:0; visibility:hidden; pointer-events:none; }
</style>

</head>
<body>
<iframe id="webstoreLoadingFrame" src="../animation.html" title="Chargement de WEB STORE" aria-hidden="true" tabindex="-1"></iframe>
<script>
  (function () {
    const frame = document.getElementById("webstoreLoadingFrame");
    let hidden = false;
    function hideLoader() {
      if (hidden) return;
      hidden = true;
      frame.classList.add("is-hidden");
      window.setTimeout(() => frame.remove(), 400);
    }
    window.addEventListener("webstore:content-ready", hideLoader, { once: true });
    window.setTimeout(hideLoader, 15000);
  })();
</script>

<header>
  <div class="logo">WEB<span>STORE</span></div>
  <nav class="menu active" style="position: static; display: flex; border: none; padding: 0;">
    <a href="../index.html">← Retour au catalogue</a>
  </nav>
</header>
<main>
  <section class="welcome">
    <h1>Catégories</h1>
    <p>Utilisez les filtres de catégories directement depuis l'accueil pour explorer le catalogue.</p>
  </section>
  <div id="categoryGrid" class="categories" style="flex-wrap: wrap;"></div>
</main>
<footer>
  WEB STORE
  <br><br>
  by <strong>DEKAL HOUSE</strong>
</footer>
<script src="../js/config.js"></script>
<script src="../js/api.js"></script>
<script>WebStoreAPI.trackVisitor().catch(() => {});</script>
<script>
  WebStoreAPI.getCategories().then((categories) => {
    const grid = document.getElementById("categoryGrid");
    categories.forEach((cat) => {
      const a = document.createElement("a");
      a.href = `../index.html?category=${encodeURIComponent(cat.slug)}`;
      a.className = "category";
      a.textContent = cat.name;
      a.style.textDecoration = "none";
      grid.appendChild(a);
    });
  }).catch(() => {
    const message = document.createElement("p");
    message.style.cssText = "color: var(--color-text-muted); font-size: 13px;";
    message.textContent = "Catégories indisponibles pour le moment.";
    document.getElementById("categoryGrid").replaceChildren(message);
  }).finally(() => {
    window.dispatchEvent(new Event("webstore:content-ready"));
  });
</script>
</body>
</html>
