<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#16A34A">
  <title>Catégories — WEB STORE</title>
  <link rel="manifest" href="../manifest.json">
  <link rel="icon" href="../icons/icon-192.png">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <header class="inner-header">
    <a class="back-link" href="../index.html">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6M9 12h12"/></svg>
      <span>WEB STORE</span>
    </a>
  </header>
  <main class="inner-page">
    <h1 class="inner-title">Explorer les catégories</h1>
    <p class="inner-intro">Parcourez les créations WEB STORE par domaine et trouvez les sites et applications qui vous intéressent.</p>
    <div class="categories-page-grid" id="categoryGrid">
      <p class="loading-state">Chargement des catégories…</p>
    </div>
  </main>
  <footer class="site-footer"><strong>WEB STORE</strong><span>by <b>DEKAL HOUSE</b></span></footer>
  <script src="../js/config.js"></script>
  <script src="../js/api.js"></script>
  <script>
    const categoryIcons = {
      technologie: '<path d="m8 8-4 4 4 4m8-8 4 4-4 4m-2-11-4 14"/>',
      développement: '<path d="m8 8-4 4 4 4m8-8 4 4-4 4m-2-11-4 14"/>',
      cybersécurité: '<path d="M12 22s8-4 8-11V5l-8-3-8 3v6c0 7 8 11 8 11Z"/><path d="m9 12 2 2 4-4"/>',
      productivité: '<path d="M4 7h16M4 12h16M4 17h16"/><circle cx="8" cy="7" r="1"/><circle cx="16" cy="17" r="1"/>',
      éducation: '<path d="m3 9 9-5 9 5-9 5-9-5Z"/><path d="M7 12v5c3 2 7 2 10 0v-5m5-3v7"/>',
      divertissement: '<path d="m8 5 11 7-11 7V5Z"/>',
      business: '<rect x="3" y="7" width="18" height="14" rx="2"/><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M3 12h18"/>',
      outils: '<path d="M14.7 6.3a5 5 0 0 0-6.4 6.4L3 18l3 3 5.3-5.3a5 5 0 0 0 6.4-6.4L14 12l-2-2 2.7-3.7Z"/>'
    };
    function iconFor(name) {
      const key = String(name || "").toLowerCase();
      const path = Object.keys(categoryIcons).find((item) => key.includes(item));
      return categoryIcons[path] || '<rect x="4" y="4" width="6" height="6" rx="1"/><rect x="14" y="4" width="6" height="6" rx="1"/><rect x="4" y="14" width="6" height="6" rx="1"/><rect x="14" y="14" width="6" height="6" rx="1"/>';
    }
    function escapeHtml(value) {
      const div = document.createElement("div");
      div.textContent = String(value ?? "");
      return div.innerHTML;
    }
    document.addEventListener("DOMContentLoaded", async () => {
      const grid = document.getElementById("categoryGrid");
      try {
        await WebStoreAPI.trackVisitor();
        const categories = await WebStoreAPI.getCategories();
        grid.replaceChildren();
        categories.forEach((category) => {
          const link = document.createElement("a");
          link.className = "category-card";
          link.href = `../index.html?category=${encodeURIComponent(category.slug)}`;
          link.innerHTML = `<span class="category-icon"><svg viewBox="0 0 24 24" aria-hidden="true">${iconFor(category.name)}</svg></span><span>${escapeHtml(category.name)}</span>`;
          grid.appendChild(link);
        });
        if (!categories.length) grid.innerHTML = '<p class="loading-state">Aucune catégorie disponible.</p>';
      } catch (_) {
        grid.innerHTML = '<p class="loading-state">Catégories indisponibles pour le moment. Réessayez plus tard.</p>';
      }
    });
  </script>
</body>
</html>
