<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fiche projet — WEB STORE</title>
<meta name="theme-color" content="#16A34A">
<link rel="manifest" href="../manifest.json">
<link rel="icon" href="../icons/icon-192.png">
<link rel="stylesheet" href="../css/style.css">
<style>
#webstoreLoadingFrame{position:fixed;inset:0;width:100%;height:100%;border:0;z-index:99999;background:#fff;opacity:1;visibility:visible;transition:opacity .35s ease,visibility .35s ease}
#webstoreLoadingFrame.is-hidden{opacity:0;visibility:hidden;pointer-events:none}
.project-sheet{background:var(--color-surface);border:1px solid var(--color-border);border-radius:16px;padding:22px;margin:8px 0 24px}
.sheet-top{display:flex;align-items:center;gap:15px;margin-bottom:18px}
.sheet-icon{width:76px;height:76px;flex:none;border-radius:16px;background:var(--color-primary-soft);color:var(--color-primary);display:grid;place-items:center;font-size:20px;font-weight:700;overflow:hidden}
.sheet-icon img{width:100%;height:100%;object-fit:cover}
.sheet-description{color:var(--color-text-muted);font-size:14px;line-height:1.7;white-space:pre-wrap}
.sheet-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}
.favorite-button{height:44px;padding:0 15px;border:1px solid var(--color-border);border-radius:9px;background:#fff;color:var(--color-text);font-weight:600;cursor:pointer}
.favorite-button.is-active{color:#dc2626;border-color:#fecaca;background:#fff7f7}
.project-details{margin-top:24px;padding-top:18px;border-top:1px solid var(--color-border)}
.project-details h2{font-size:17px;margin-bottom:13px}
.details-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.detail-item{padding:12px;border-radius:10px;background:var(--color-bg);min-width:0}
.detail-item span{display:block;color:var(--color-text-muted);font-size:11px;margin-bottom:5px}
.detail-item strong{font-size:13px;overflow-wrap:anywhere}
.report-link{font-size:11px;color:var(--color-text-muted);background:none;border:0;text-decoration:underline;cursor:pointer;margin-top:16px}
@media(max-width:480px){.project-sheet{padding:16px}.details-grid{grid-template-columns:1fr 1fr}.sheet-icon{width:64px;height:64px}}
</style>
</head>
<body>
<iframe id="webstoreLoadingFrame" src="../animation.html" title="Chargement de WEB STORE" aria-hidden="true" tabindex="-1"></iframe>
<script>
(function(){const frame=document.getElementById("webstoreLoadingFrame");let hidden=false;function hide(){if(hidden)return;hidden=true;frame.classList.add("is-hidden");setTimeout(()=>frame.remove(),400)}window.addEventListener("webstore:content-ready",hide,{once:true});setTimeout(hide,15000)})();
</script>
<header>
  <div class="logo">WEB<span>STORE</span></div>
  <nav class="menu active" style="position:static;display:flex;border:0;padding:0"><a href="../index.html">← Retour au catalogue</a></nav>
</header>
<main>
  <section class="project-sheet" id="projectSheet"><p>Chargement…</p></section>
</main>
<footer>WEB STORE<br><br>by <strong>DEKAL HOUSE</strong></footer>
<script src="../js/config.js"></script>
<script src="../js/api.js"></script>
<script>
const slug=new URLSearchParams(location.search).get("slug");
document.addEventListener("DOMContentLoaded",async()=>{
  if(!slug){renderError("Projet introuvable.");return window.dispatchEvent(new Event("webstore:content-ready"))}
  try{
    await WebStoreAPI.trackVisitor();
    const project=await WebStoreAPI.getProject(slug);
    let favorite={is_favorite:false,favorites_count:project.favorites_count||0};
    try{favorite=await WebStoreAPI.getFavorite(slug)}catch(_){ }
    renderProject(project,favorite);
    WebStoreAPI.trackEvent(slug,"view");
  }catch(_){renderError("Impossible de charger ce projet pour le moment.")}
  finally{window.dispatchEvent(new Event("webstore:content-ready"))}
});
function renderProject(project,favorite){
  const initials=project.name.split(/\s+/).map(w=>w[0]).join("").slice(0,2).toUpperCase();
  const icon=project.icon_data?`<img src="${escapeHtml(project.icon_data)}" alt="Icône de ${escapeHtml(project.name)}">`:initials;
  const created=project.created_at?new Date(project.created_at).toLocaleDateString("fr-FR"):"Non renseignée";
  const sheet=document.getElementById("projectSheet");
  sheet.innerHTML=`
    <div class="sheet-top"><div class="sheet-icon">${icon}</div><div><h1 style="font-size:22px;margin-bottom:7px">${escapeHtml(project.name)}</h1><span class="badge ${project.type==="PWA"?"pwa":"web"}">${project.type==="PWA"?"PWA":"WEB"}</span></div></div>
    <p class="sheet-description">${escapeHtml(project.description||"Aucune description disponible pour ce projet.")}</p>
    <div class="sheet-actions"><button class="button-primary" id="visitBtn">Visiter le site</button>${project.type==="PWA"?'<button class="button-secondary" id="installBtn">Installer</button>':''}<button class="favorite-button ${favorite.is_favorite?"is-active":""}" id="favoriteBtn" aria-pressed="${favorite.is_favorite}">${favorite.is_favorite?"♥ Enregistré":"♡ Ajouter aux favoris"} · <span id="favoriteCount">${favorite.favorites_count||0}</span></button></div>
    <section class="project-details"><h2>Informations sur le projet</h2><div class="details-grid">
      <div class="detail-item"><span>Développeur</span><strong>${escapeHtml(project.developer_name||"Non renseigné")}</strong></div>
      <div class="detail-item"><span>Catégorie</span><strong>${escapeHtml(project.category||"Autre")}</strong></div>
      <div class="detail-item"><span>Type</span><strong>${project.type==="PWA"?"Application PWA":"Site Web"}</strong></div>
      <div class="detail-item"><span>Mis en favoris</span><strong><span id="favoriteInfoCount">${favorite.favorites_count||0}</span> fois</strong></div>
      <div class="detail-item"><span>Publication</span><strong>${created}</strong></div>
      <div class="detail-item"><span>État PWA</span><strong>${project.type==="PWA"?(project.pwa_verified?"Vérifiée":"Non vérifiée") : "Non applicable"}</strong></div>
    </div></section>
    <button class="report-link" id="reportBtn">Signaler cette publication</button>`;
  document.getElementById("visitBtn").addEventListener("click",()=>{WebStoreAPI.trackEvent(slug,"visit_click");const url=safeExternalUrl(project.url);if(!url)return alert("L'adresse de ce projet n'est pas valide.");window.open(url,"_blank","noopener,noreferrer")});
  const install=document.getElementById("installBtn");if(install)install.addEventListener("click",()=>{const url=safeExternalUrl(project.url);if(!url)return alert("L'adresse de cette PWA n'est pas valide.");WebStoreAPI.trackEvent(slug,"install");alert("La page de cette PWA va s’ouvrir. Dans le navigateur, choisissez « Installer l’application » ou « Ajouter à l’écran d’accueil » si cette option est proposée.");window.open(url,"_blank","noopener,noreferrer")});
  document.getElementById("favoriteBtn").addEventListener("click",async(event)=>{const button=event.currentTarget;if(button.disabled)return;button.disabled=true;try{const result=await WebStoreAPI.toggleFavorite(slug);const active=result.is_favorite;button.classList.toggle("is-active",active);button.setAttribute("aria-pressed",String(active));button.innerHTML=`${active?"♥ Enregistré":"♡ Ajouter aux favoris"} · <span id="favoriteCount">${result.favorites_count}</span>`;document.getElementById("favoriteInfoCount").textContent=result.favorites_count}catch(_){alert("Impossible de mettre à jour les favoris. Vérifiez votre connexion puis réessayez.")}finally{button.disabled=false}});
  document.getElementById("reportBtn").addEventListener("click",()=>{const reason=prompt("Pourquoi signalez-vous cette publication ?");if(!reason)return;WebStoreAPI.postReport(slug,{reason,description:""}).then(()=>alert("Merci, votre signalement a été transmis à l'administration.")).catch(()=>alert("Impossible d'envoyer le signalement pour le moment."))});
}
function renderError(message){document.getElementById("projectSheet").textContent=message}
function safeExternalUrl(value){try{const url=new URL(String(value||""));return ["http:","https:"].includes(url.protocol)?url.href:""}catch(_){return ""}}
function escapeHtml(value){const div=document.createElement("div");div.textContent=String(value??"");return div.innerHTML}
</script>
</body>
</html>
