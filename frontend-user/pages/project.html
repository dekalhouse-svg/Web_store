<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fiche projet — WEB STORE</title>
<meta name="theme-color" content="#16A34A">
<link rel="manifest" href="../manifest.json">
<link rel="icon" href="../icons/icon-192.png">
<link rel="stylesheet" href="../css/style.css">
<style>
  .sheet { background: var(--color-surface); border: 1px solid var(--color-border); border-radius: 15px; padding: 20px; margin-bottom: 24px; }
  .sheet-top { display: flex; align-items: center; gap: 14px; margin-bottom: 16px; }
  .sheet-icon { width: 72px; height: 72px; border-radius: 16px; background: var(--color-primary-soft); color: var(--color-primary); display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: bold; flex: none; overflow: hidden; }
  .sheet-icon img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .sheet-actions { display: flex; gap: 10px; margin-top: 18px; flex-wrap: wrap; }
  .comment { border-bottom: 1px solid var(--color-border); padding: 12px 0; font-size: 13px; }
  .comment strong { display: block; margin-bottom: 4px; }
  .comment-form { display: flex; flex-direction: column; gap: 10px; margin-top: 14px; }
  .comment-form input, .comment-form textarea {
    border: 1px solid var(--color-border); border-radius: 9px; padding: 10px 12px; font-size: 13px; font-family: inherit;
  }
  .report-link { font-size: 11px; color: var(--color-text-muted); background: none; border: none; text-decoration: underline; cursor: pointer; margin-top: 10px; }
</style>
</head>
<body>

<header>
  <div class="logo">WEB<span>STORE</span></div>
  <nav class="menu active" style="position: static; display: flex; border: none; padding: 0;">
    <a href="../index.html">← Retour au catalogue</a>
  </nav>
</header>

<main>

  <section class="sheet" id="projectSheet">
    <p>Chargement…</p>
  </section>

  <section class="section" id="commentsSection" hidden>
    <div class="section-header">
      <h2>Commentaires</h2>
    </div>
    <div id="commentList"></div>

    <form class="comment-form" id="commentForm">
      <input type="text" id="authorName" placeholder="Votre nom ou pseudonyme" maxlength="60" required>
      <textarea id="commentContent" placeholder="Votre commentaire" maxlength="500" rows="3" required></textarea>
      <button type="submit" class="button-primary">Publier le commentaire</button>
    </form>
  </section>

</main>

<footer>
  WEB STORE
  <br><br>
  by <strong>DEKAL HOUSE</strong>
</footer>

<script src="../js/config.js"></script>
<script src="../js/api.js"></script>
<script>WebStoreAPI.trackVisitor().catch(() => {});</script>
<script>
  const params = new URLSearchParams(window.location.search);
  const slug = params.get("slug");

  document.addEventListener("DOMContentLoaded", () => {
    if (!slug) {
      renderError("Projet introuvable.");
      return;
    }
    loadProject();
  });

  async function loadProject() {
    try {
      const project = await WebStoreAPI.getProject(slug);
      renderProject(project);
      // Visite de la fiche = un événement, comptabilisé côté backend.
      WebStoreAPI.trackEvent(slug, "view");
      loadComments(project.comments || []);
    } catch (err) {
      renderError("Impossible de charger ce projet pour le moment.");
    }
  }

  function renderProject(project) {
    const sheet = document.getElementById("projectSheet");
    const initials = project.name.split(" ").map(w => w[0]).join("").slice(0, 2).toUpperCase();

    const icon = project.icon_data
      ? `<img src="${escapeHtml(project.icon_data)}" alt="Icône de ${escapeHtml(project.name)}">`
      : initials;

    sheet.innerHTML = `
      <div class="sheet-top">
        <div class="sheet-icon">${icon}</div>
        <div>
          <h1 style="font-size:20px;">${escapeHtml(project.name)}</h1>
          <span class="badge ${project.type === "PWA" ? "pwa" : "web"}">${project.type}</span>
        </div>
      </div>
      <p style="color: var(--color-text-muted); font-size: 14px; line-height: 1.6;">
        ${escapeHtml(project.description || "")}
      </p>
      <div class="sheet-actions">
        <button class="button-primary" id="visitBtn">Visiter le site</button>
        ${project.pwa_verified ? '<button class="button-secondary" id="installBtn">Installer</button>' : ''}
      </div>
      <button class="report-link" id="reportBtn">Signaler cette publication</button>
    `;

    document.getElementById("visitBtn").addEventListener("click", () => {
      WebStoreAPI.trackEvent(slug, "visit_click");
      window.open(project.url, "_blank", "noopener");
    });

    const installBtn = document.getElementById("installBtn");
    if (installBtn) {
      installBtn.addEventListener("click", () => {
        WebStoreAPI.trackEvent(slug, "install");
        // Une PWA externe ne peut pas être installée directement depuis
        // l'origine WEB STORE. On ouvre sa propre origine pour que le
        // navigateur puisse proposer l'installation.
        window.open(project.url, "_blank", "noopener");
      });
    }

    document.getElementById("reportBtn").addEventListener("click", openReportDialog);

    document.getElementById("commentsSection").hidden = false;
  }

  function renderError(message) {
    document.getElementById("projectSheet").innerHTML = `<p>${escapeHtml(message)}</p>`;
  }

  function loadComments(comments) {
    const list = document.getElementById("commentList");
    list.innerHTML = "";
    if (comments.length === 0) {
      list.innerHTML = `<p style="color: var(--color-text-muted); font-size: 13px;">Aucun commentaire pour le moment.</p>`;
      return;
    }
    comments.forEach((comment) => {
      const div = document.createElement("div");
      div.className = "comment";
      div.innerHTML = `<strong>${escapeHtml(comment.author_name)}</strong>${escapeHtml(comment.content)}`;
      list.appendChild(div);
    });
  }

  document.getElementById("commentForm").addEventListener("submit", async (event) => {
    event.preventDefault();
    const authorName = document.getElementById("authorName").value.trim();
    const content = document.getElementById("commentContent").value.trim();
    if (!authorName || !content) return;

    try {
      await WebStoreAPI.postComment(slug, { author_name: authorName, content });
      document.getElementById("commentForm").reset();
      loadProject();
    } catch (err) {
      alert("Impossible d'envoyer le commentaire pour le moment.");
    }
  });

  function openReportDialog() {
    const reason = prompt("Pourquoi signalez-vous cette publication ?");
    if (!reason) return;
    WebStoreAPI.postReport(slug, { reason, description: "" })
      .then(() => alert("Merci, votre signalement a été transmis à l'administration."))
      .catch(() => alert("Impossible d'envoyer le signalement pour le moment."));
  }

  function escapeHtml(value) {
    const div = document.createElement("div");
    div.textContent = value;
    return div.innerHTML;
  }
</script>
</body>
</html>
