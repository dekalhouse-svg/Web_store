<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#16A34A"><meta name="description" content="Informations sur un site ou une application PWA sur WEB STORE."><title>Projet — WEB STORE</title><link rel="manifest" href="../manifest.json"><link rel="stylesheet" href="../css/style.css"></head><body>
<header class="inner-header"><a class="back-link" href="../index.html"><svg viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg>Retour au catalogue</a><span style="flex:1"></span><button class="round-action" id="shareProject" type="button" aria-label="Partager"><svg viewBox="0 0 24 24"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="m8.7 10.7 6.6-4.4m-6.6 7.4 6.6 4.4"/></svg></button><button class="round-action" id="headerFavorite" type="button" aria-label="Ajouter aux favoris"><svg viewBox="0 0 24 24"><path d="M20.8 8.8c0 5.2-8.8 10.1-8.8 10.1S3.2 14 3.2 8.8A4.7 4.7 0 0 1 12 6.2a4.7 4.7 0 0 1 8.8 2.6Z"/></svg></button></header>
<main class="project-page"><h1 class="inner-title">Présentation du projet</h1><section class="project-detail-card" id="projectSheet"><p class="loading-state">Chargement du projet…</p></section><section class="detail-section" id="similarSection" hidden><h2>Vous pourriez aussi aimer</h2><div class="developer-projects" id="similarProjects"></div></section></main><footer class="site-footer"><strong>WEB STORE</strong><span>by <b>DEKAL HOUSE</b></span></footer>
<script src="../js/config.js"></script><script src="../js/api.js"></script><script>
const slug=new URLSearchParams(location.search).get('slug');let project=null,favorite=false;
const heart='<svg viewBox="0 0 24 24"><path d="M20.8 8.8c0 5.2-8.8 10.1-8.8 10.1S3.2 14 3.2 8.8A4.7 4.7 0 0 1 12 6.2a4.7 4.7 0 0 1 8.8 2.6Z"/></svg>';
function esc(v){const e=document.createElement('span');e.textContent=String(v??'');return e.innerHTML}
function safeUrl(v){try{const u=new URL(String(v||''));return ['http:','https:'].includes(u.protocol)?u.href:''}catch(_){return ''}}
function ready(){window.dispatchEvent(new Event('webstore:content-ready'))}
document.addEventListener('DOMContentLoaded',async()=>{if(!slug){showError('Projet introuvable.');ready();return}try{const [p]=await Promise.all([WebStoreAPI.getProject(slug),WebStoreAPI.trackVisitor().catch(()=>null)]);project=p;WebStoreAPI.trackEvent(slug,'view');try{const f=await WebStoreAPI.getFavorite(slug);favorite=!!f.is_favorite;project.favorites_count=f.favorites_count??project.favorites_count}catch(_){}render();loadSimilar();bindHeader()}catch(e){showError(e.message||'Impossible de charger ce projet.');}finally{ready()}});
function render(){const icon=project.icon_url||project.icon_data;const iconHtml=icon?'<img src="'+esc(WebStoreAPI.getAssetUrl(icon))+'" alt="Icône de '+esc(project.name)+'">':esc(project.name.slice(0,2).toUpperCase());const date=project.created_at?new Date(project.created_at).toLocaleDateString('fr-FR'):'Non renseignée';const kind=project.type==='PWA'?'Application PWA':'Site web';const sheet=document.getElementById('projectSheet');sheet.innerHTML=`<div class="project-identity"><div class="project-icon">${iconHtml}</div><div class="project-identity-text"><h2>${esc(project.name)}</h2><p>par <a href="developer.html?id=${project.developer_id}">${esc(project.developer_name||'Développeur')}</a></p>${project.type==='PWA'&&project.pwa_verified?'<span class="verified-label">✓ PWA vérifiée</span>':''}</div></div><div class="project-stats"><div class="project-stat"><strong id="favoriteStat">${Number(project.favorites_count||0)}</strong><span>Favoris</span></div><div class="project-stat"><strong>${Number(project.visits_count||0)}</strong><span>Visites</span></div><div class="project-stat"><strong>${Number(project.installs_count||0)}</strong><span>Installations</span></div></div><div class="project-actions"><button class="action-button primary" id="visitBtn" type="button">↗ Visiter</button>${project.type==='PWA'?'<button class="action-button" id="installBtn" type="button">＋ Installer</button>':''}<button class="action-button" id="favoriteBtn" type="button" aria-pressed="${favorite}">${heart}<span id="favoriteLabel">${favorite?'Retirer des favoris':'Ajouter aux favoris'}</span></button></div><section class="detail-section"><h3>À propos de ce projet</h3><p class="detail-description">${esc(project.description||'Aucune description disponible.')}</p></section><section class="detail-section"><h3>Informations sur le projet</h3><div class="detail-information"><div class="information-item"><span>Développeur</span><strong><a href="developer.html?id=${project.developer_id}">${esc(project.developer_name||'Non renseigné')}</a></strong></div><div class="information-item"><span>Catégorie</span><strong>${esc(project.category||'Autre')}</strong></div><div class="information-item"><span>Type</span><strong>${kind}</strong></div><div class="information-item"><span>Mis en favoris</span><strong><span id="favoriteInfoCount">${Number(project.favorites_count||0)}</span> fois</strong></div><div class="information-item"><span>Publication</span><strong>${date}</strong></div><div class="information-item"><span>État PWA</span><strong>${project.type==='PWA'?(project.pwa_verified?'Vérifiée':'Non vérifiée'):'Non applicable'}</strong></div></div></section><button class="report-link" id="reportBtn" type="button">Signaler cette publication</button>`;
const img=sheet.querySelector('.project-icon img');img?.addEventListener('error',()=>{img.parentElement.textContent=project.name.slice(0,2).toUpperCase()});document.getElementById('favoriteBtn').addEventListener('click',toggleFavorite);document.getElementById('visitBtn').addEventListener('click',visit);document.getElementById('installBtn')?.addEventListener('click',install);document.getElementById('reportBtn').addEventListener('click',report)}
async function toggleFavorite(){const b=document.getElementById('favoriteBtn');b.disabled=true;try{await WebStoreAPI.trackVisitor();const d=await WebStoreAPI.toggleFavorite(slug);favorite=!!d.is_favorite;project.favorites_count=d.favorites_count;document.getElementById('favoriteStat').textContent=d.favorites_count;document.getElementById('favoriteInfoCount').textContent=d.favorites_count;document.getElementById('favoriteLabel').textContent=favorite?'Retirer des favoris':'Ajouter aux favoris';b.setAttribute('aria-pressed',String(favorite));b.classList.toggle('favorite-active',favorite);updateHeader()}catch(e){alert(e.message||'Impossible de modifier les favoris. Vérifiez votre connexion.')}finally{b.disabled=false}}
function updateHeader(){const b=document.getElementById('headerFavorite');b.classList.toggle('favorite-active',favorite);b.setAttribute('aria-label',favorite?'Retirer des favoris':'Ajouter aux favoris')}
function bindHeader(){updateHeader();document.getElementById('headerFavorite').addEventListener('click',toggleFavorite);document.getElementById('shareProject').addEventListener('click',async()=>{const data={title:project.name,text:'Découvre '+project.name+' sur WEB STORE',url:location.href};if(navigator.share){try{await navigator.share(data)}catch(_){}}else if(navigator.clipboard?.writeText){try{await navigator.clipboard.writeText(location.href);alert('Lien copié.')}catch(_){prompt('Copiez le lien :',location.href)}}else prompt('Copiez le lien :',location.href)})}
function visit(){const u=safeUrl(project.url);if(!u){alert('Adresse du projet invalide.');return}WebStoreAPI.trackEvent(slug,'visit_click');window.open(u,'_blank','noopener,noreferrer')}
function install(){const u=safeUrl(project.url);if(!u){alert('Adresse de cette PWA invalide.');return}WebStoreAPI.trackEvent(slug,'install');alert('La PWA va s’ouvrir dans un nouvel onglet. Si elle est installable, ouvrez le menu de votre navigateur puis choisissez « Installer l’application » ou « Ajouter à l’écran d’accueil ».');window.open(u,'_blank','noopener,noreferrer')}
function report(){const reason=prompt('Motif du signalement :');if(!reason?.trim())return;WebStoreAPI.postReport(slug,{reason:reason.trim()}).then(()=>alert('Signalement transmis. Merci.')).catch(e=>alert(e.message||'Envoi impossible.'))}
async function loadSimilar(){try{const items=await WebStoreAPI.getSimilarProjects(slug);if(!items.length)return;const box=document.getElementById('similarProjects');box.replaceChildren();items.forEach(p=>{const a=document.createElement('a');a.className='developer-project-card';a.href='project.html?slug='+encodeURIComponent(p.slug);a.innerHTML='<span class="project-icon">'+esc(p.name.slice(0,2).toUpperCase())+'</span><strong>'+esc(p.name)+'</strong>';box.append(a)});document.getElementById('similarSection').hidden=false}catch(_){}}
function showError(msg){document.getElementById('projectSheet').innerHTML='<p class="loading-state">'+esc(msg)+'</p>'}
</script></body></html>
