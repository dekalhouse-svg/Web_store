<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#16A34A"><title>Développeur — WEB STORE</title><link rel="stylesheet" href="../css/style.css"></head><body><header class="inner-header"><a class="back-link" href="../index.html">← WEB STORE</a></header><main class="inner-page"><h1 class="inner-title" id="devName">Profil développeur</h1><p class="inner-intro" id="devMeta">Projets publiés sur WEB STORE</p><div class="project-list" id="devProjects"><p class="loading-state">Chargement…</p></div></main><footer class="site-footer"><strong>WEB STORE</strong><span>by <b>DEKAL HOUSE</b></span></footer><script src="../js/config.js"></script><script src="../js/api.js"></script><script>function esc(v){const e=document.createElement('span');e.textContent=String(v??'');return e.innerHTML}document.addEventListener('DOMContentLoaded',async()=>{const id=new URLSearchParams(location.search).get('id'),box=document.getElementById('devProjects');if(!id){box.textContent='Développeur introuvable.';return}try{const d=await WebStoreAPI.getDeveloper(id);document.getElementById('devName').textContent=d.name;document.getElementById('devMeta').textContent=d.projects_count+' projet(s) publié(s)';box.replaceChildren();d.projects.forEach(p=>{const a=document.createElement('a');a.className='developer-project-card';a.href='project.html?slug='+encodeURIComponent(p.slug);a.innerHTML='<span class="project-icon">'+esc(p.name.slice(0,2).toUpperCase())+'</span><strong>'+esc(p.name)+'</strong>';box.append(a)});if(!d.projects.length)box.innerHTML='<p class="empty-state">Aucun projet public.</p>'}catch(e){box.textContent=e.message||'Profil indisponible.'}})</script></body></html>
