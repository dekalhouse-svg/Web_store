<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#16A34A"><title>Développeur — WEB STORE</title><link rel="stylesheet" href="../css/style.css"></head><body><script src="../js/consent-gate.js"></script><iframe id="webstoreLoadingFrame" class="loading-frame" src="../animation.html" title="Chargement de WEB STORE" aria-hidden="true" tabindex="-1"></iframe><script>(()=>{const f=document.getElementById('webstoreLoadingFrame');let done=false;function hide(){if(done)return;done=true;f.classList.add('is-hidden');setTimeout(()=>f.remove(),400)}window.addEventListener('webstore:content-ready',hide,{once:true});setTimeout(hide,15000)})();</script><header class="inner-header"><a class="back-link" href="../index.html"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg><span>WEB STORE</span></a></header><main class="inner-page"><h1 class="inner-title" id="devName">Profil développeur</h1><p class="inner-intro" id="devMeta">Projets publiés sur WEB STORE</p><div class="project-list" id="devProjects"><p class="loading-state">Chargement…</p></div></main><nav class="bottom-navigation" aria-label="Navigation principale"><a class="bottom-nav-item" href="../index.html"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1Z"/></svg><span>Accueil</span></a><a class="bottom-nav-item" href="categories.html"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg><span>Explorer</span></a><a class="bottom-nav-item" href="../index.html?favorites=1"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.8 8.8c0 5.2-8.8 10.1-8.8 10.1S3.2 14 3.2 8.8A4.7 4.7 0 0 1 12 6.2a4.7 4.7 0 0 1 8.8 2.6Z"/></svg><span>Favoris</span></a><a class="bottom-nav-item" href="contact.html"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="3.5"/><path d="M5 20a7 7 0 0 1 14 0"/></svg><span>Contact</span></a></nav><footer class="site-footer"><strong>WEB STORE</strong><span>by <b>DEKAL HOUSE</b></span></footer><script src="../js/config.js"></script><script src="../js/api.js"></script><script>function esc(v){const e=document.createElement('span');e.textContent=String(v??'');return e.innerHTML}document.addEventListener('DOMContentLoaded',async()=>{const id=new URLSearchParams(location.search).get('id'),box=document.getElementById('devProjects');if(!id){box.textContent='Développeur introuvable.';window.dispatchEvent(new Event('webstore:content-ready'));return}try{const d=await WebStoreAPI.getDeveloper(id);document.getElementById('devName').textContent=d.name;document.getElementById('devMeta').textContent=d.projects_count+' projet(s) publié(s)';box.replaceChildren();d.projects.forEach(p=>{const a=document.createElement('a');a.className='developer-project-card';a.href='project.html?slug='+encodeURIComponent(p.slug);a.innerHTML='<span class="project-icon">'+esc(p.name.slice(0,2).toUpperCase())+'</span><strong>'+esc(p.name)+'</strong>';box.append(a)});if(!d.projects.length)box.innerHTML='<p class="empty-state">Aucun projet public.</p>'}catch(e){box.textContent=e.message||'Profil indisponible.'}finally{window.dispatchEvent(new Event('webstore:content-ready'))}})</script><nav class="ws-legal-footer" aria-label="Informations légales"><a href="conditions.html">Conditions générales</a></nav></body></html>
