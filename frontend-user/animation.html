<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#16A34A">
  <title>Chargement — WEB STORE</title>
  <style>
    :root {
      color-scheme: light;
      --green: #16a34a;
      --green-soft: #eaf7ee;
      --skeleton: #e9ecea;
      --ink: #17211b;
      --muted: #87918a;
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      min-width: 0;
      min-height: 100%;
      margin: 0;
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 12px;
      overflow: hidden;
      background: #f4f6f4;
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system,
        BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .loader {
      width: min(100%, 330px);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .phone {
      position: relative;
      width: 100%;
      height: min(690px, calc(100vh - 66px));
      min-height: 430px;
      overflow: hidden;
      border: 5px solid #252525;
      border-radius: 34px;
      background: #fff;
      box-shadow: 0 14px 38px rgb(0 0 0 / 13%);
    }

    .phone-top {
      height: 39px;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding-top: 8px;
    }

    .island {
      width: 88px;
      height: 22px;
      border-radius: 20px;
      background: #171717;
    }

    .header {
      min-height: 54px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 15px 10px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--green);
      font-size: 17px;
      font-weight: 850;
      letter-spacing: -.7px;
    }

    .brand-mark {
      width: 29px;
      height: 29px;
      display: grid;
      place-items: center;
      border-radius: 9px;
      background: var(--green);
      color: #fff;
      font-size: 15px;
      font-weight: 900;
    }

    .content {
      height: calc(100% - 164px);
      padding: 3px 13px 12px;
      overflow: hidden;
    }

    .profile-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 1px 0 19px;
    }

    .avatar {
      width: 41px;
      height: 41px;
      flex: 0 0 41px;
      border-radius: 50%;
    }

    .profile-lines { flex: 1; min-width: 0; }

    .skeleton {
      position: relative;
      overflow: hidden;
      border-radius: 9px;
      background: var(--skeleton);
    }

    .skeleton::after {
      position: absolute;
      inset: 0;
      content: "";
      transform: translateX(-110%);
      background: linear-gradient(90deg, transparent, rgb(255 255 255 / 78%), transparent);
      animation: shimmer 1.55s ease-in-out infinite;
    }

    .line { height: 11px; margin-bottom: 9px; }
    .line:last-child { margin-bottom: 0; }

    .hero {
      margin: 16px 0 18px;
      padding: 15px;
      border-radius: 15px;
      background: #f0f8f2;
    }

    .hero-label {
      width: 39%;
      height: 9px;
      margin-bottom: 13px;
      border-radius: 8px;
      background: #cfe9d5;
    }

    .hero-title { width: 86%; height: 15px; margin-bottom: 9px; }
    .hero-subtitle { width: 62%; height: 10px; }
    .hero-button {
      width: 100px;
      height: 27px;
      margin-top: 15px;
      border-radius: 8px;
      background: #b8dfc2;
    }

    .section-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin: 17px 0 11px;
    }

    .project-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    .project-card {
      min-width: 0;
      padding: 8px;
      border: 1px solid #edf0ed;
      border-radius: 13px;
      background: #fff;
    }

    .project-cover {
      width: 100%;
      height: clamp(66px, 19vw, 96px);
      margin-bottom: 10px;
      border-radius: 8px;
    }

    .project-title { width: 84%; height: 10px; margin-bottom: 8px; }
    .project-meta { width: 57%; height: 8px; }
    .project-action { width: 68%; height: 21px; margin-top: 12px; border-radius: 7px; }

    .bottom-nav {
      position: absolute;
      right: 0;
      bottom: 0;
      left: 0;
      height: 66px;
      display: flex;
      align-items: center;
      justify-content: space-around;
      padding: 3px 5px 7px;
      background: #171717;
      color: #a9aaa9;
    }

    .nav-item {
      min-width: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      font-size: 9px;
    }

    .nav-icon { font-size: 17px; line-height: 18px; }
    .nav-item.active { color: #fff; }
    .nav-item.active .nav-icon { color: #4ade80; }

    .home-indicator {
      position: absolute;
      z-index: 2;
      bottom: 4px;
      left: 40%;
      width: 20%;
      height: 3px;
      border-radius: 5px;
      background: #858585;
    }

    .loading-status {
      display: flex;
      align-items: center;
      gap: 7px;
      color: #477454;
      font-size: 11px;
      font-weight: 650;
      text-align: center;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      flex: 0 0 7px;
      border-radius: 50%;
      background: var(--green);
      animation: pulse 1s ease-in-out infinite alternate;
    }

    @keyframes shimmer {
      100% { transform: translateX(110%); }
    }

    @keyframes pulse {
      to { opacity: .3; transform: scale(.72); }
    }

    @media (max-height: 520px) {
      body { padding: 5px; }
      .loader { width: min(100%, 270px); gap: 5px; }
      .phone { height: calc(100vh - 38px); min-height: 0; }
      .content { height: calc(100% - 145px); }
      .hero { margin: 9px 0; padding: 10px; }
      .section-heading { margin: 9px 0; }
      .project-cover { height: 58px; }
      .loading-status { font-size: 10px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
      }
    }
  
    html { transition: opacity .25s ease; }
    html[data-state="hidden"] { opacity: 0; pointer-events: none; }
    html[data-paused="true"] *,
    html[data-paused="true"] *::before,
    html[data-paused="true"] *::after { animation-play-state: paused !important; }
  </style>
</head>
<body>
  <main class="loader" role="status" aria-live="polite">
    <section class="phone" aria-label="Aperçu du chargement de WEB STORE">
      <div class="phone-top"><div class="island" aria-hidden="true"></div></div>

      <header class="header">
        <div class="brand"><span class="brand-mark" aria-hidden="true">W</span> WEB STORE</div>
        <div class="skeleton" style="width:32px;height:32px;border-radius:50%" aria-hidden="true"></div>
      </header>

      <div class="content" aria-hidden="true">
        <div class="profile-row">
          <div class="skeleton avatar"></div>
          <div class="profile-lines">
            <div class="skeleton line" style="width:49%"></div>
            <div class="skeleton line" style="width:72%"></div>
          </div>
        </div>

        <div class="skeleton line" style="width:91%;height:13px"></div>
        <div class="skeleton line" style="width:58%;height:12px"></div>

        <section class="hero">
          <div class="hero-label"></div>
          <div class="skeleton hero-title"></div>
          <div class="skeleton hero-subtitle"></div>
          <div class="hero-button"></div>
        </section>

        <div class="section-heading">
          <div class="skeleton" style="width:42%;height:13px"></div>
          <div class="skeleton" style="width:20%;height:9px"></div>
        </div>

        <div class="project-grid">
          <article class="project-card">
            <div class="skeleton project-cover"></div>
            <div class="skeleton project-title"></div>
            <div class="skeleton project-meta"></div>
            <div class="skeleton project-action"></div>
          </article>
          <article class="project-card">
            <div class="skeleton project-cover"></div>
            <div class="skeleton project-title"></div>
            <div class="skeleton project-meta"></div>
            <div class="skeleton project-action"></div>
          </article>
        </div>

        <div class="section-heading">
          <div class="skeleton" style="width:38%;height:11px"></div>
        </div>
        <div class="skeleton line" style="width:76%;height:9px"></div>
      </div>

      <nav class="bottom-nav" aria-hidden="true">
        <div class="nav-item active"><span class="nav-icon">⌂</span><span>Accueil</span></div>
        <div class="nav-item"><span class="nav-icon">▤</span><span>Explorer</span></div>
        <div class="nav-item"><span class="nav-icon">＋</span><span>Publier</span></div>
        <div class="nav-item"><span class="nav-icon">♡</span><span>Favoris</span></div>
        <div class="nav-item"><span class="nav-icon">♙</span><span>Profil</span></div>
      </nav>
      <div class="home-indicator" aria-hidden="true"></div>
    </section>

    <div class="loading-status"><span class="status-dot" aria-hidden="true"></span> Préparation de WEB STORE…</div>
  </main>

  <script>
    (() => {
      const root = document.documentElement;
      const loader = document.querySelector(".loader");
      const frame = window.frameElement;
      let observer = null;

      function stopAnimation() {
        root.dataset.state = "hidden";
        if (loader) loader.setAttribute("aria-hidden", "true");
        if (observer) observer.disconnect();
      }

      // L'index parent reste responsable de la fin réelle du chargement.
      // Cette iframe détecte simplement quand le parent commence à la masquer.
      if (frame) {
        observer = new MutationObserver(() => {
          if (!frame.isConnected || frame.classList.contains("is-hidden")) {
            stopAnimation();
          }
        });
        observer.observe(frame, { attributes: true, attributeFilter: ["class"] });
        if (frame.classList.contains("is-hidden")) stopAnimation();
      }

      // Économise les animations lorsque l'onglet n'est pas visible.
      function syncVisibility() {
        root.dataset.paused = document.hidden ? "true" : "false";
      }
      document.addEventListener("visibilitychange", syncVisibility);
      syncVisibility();
    })();
  </script>

</body>
</html>
