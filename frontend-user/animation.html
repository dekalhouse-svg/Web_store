<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#16A34A">
<title>Chargement — WEB STORE</title>
<style>
  * { box-sizing: border-box; }
  html, body { width: 100%; height: 100%; margin: 0; }
  body { display: grid; place-items: center; background: #ffffff; color: #17231b; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  .loader { display: flex; flex-direction: column; align-items: center; gap: 22px; padding: 28px; text-align: center; }
  .mark { position: relative; width: 76px; height: 76px; display: grid; place-items: center; border-radius: 22px; background: #f0fdf4; color: #16a34a; font-size: 25px; font-weight: 800; letter-spacing: -2px; }
  .mark::before { content: ""; position: absolute; inset: -7px; border: 3px solid transparent; border-top-color: #16a34a; border-right-color: #86efac; border-radius: 28px; animation: rotate 1.15s linear infinite; }
  .brand { font-size: 20px; font-weight: 800; letter-spacing: -.7px; }
  .brand span { color: #16a34a; }
  .message { margin-top: -14px; color: #64748b; font-size: 13px; }
  .dots { display: flex; gap: 6px; margin-top: -12px; }
  .dots i { width: 7px; height: 7px; border-radius: 50%; background: #16a34a; animation: pulse .9s ease-in-out infinite; }
  .dots i:nth-child(2) { animation-delay: .15s; }
  .dots i:nth-child(3) { animation-delay: .3s; }
  @keyframes rotate { to { transform: rotate(360deg); } }
  @keyframes pulse { 0%, 80%, 100% { opacity: .3; transform: translateY(0) scale(.8); } 40% { opacity: 1; transform: translateY(-4px) scale(1); } }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; } }
</style>
</head>
<body>
  <main class="loader" role="status" aria-live="polite">
    <div class="mark" aria-hidden="true">WS</div>
    <div class="brand">WEB<span>STORE</span></div>
    <p class="message">Préparation de votre espace de découverte…</p>
    <div class="dots" aria-hidden="true"><i></i><i></i><i></i></div>
  </main>
</body>
</html>
