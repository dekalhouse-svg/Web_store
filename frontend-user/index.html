<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WEB STORE — Découvrez le Web</title>
<meta name="description" content="Découvrez et installez des sites Web et applications PWA créés par des développeurs indépendants.">
<meta name="theme-color" content="#16A34A">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="offline-banner" id="offlineBanner" hidden>
  Vous êtes hors ligne. Certaines informations peuvent ne pas être à jour.
</div>

<header>
  <div class="logo">WEB<span>STORE</span></div>

  <nav class="menu" id="menu">
    <a href="index.html">Accueil</a>
    <a href="pages/categories.html">Catégories</a>
    <a href="pages/legal.html">Pages légales</a>
    <a href="pages/contact.html">Contact</a>
  </nav>

  <button class="menu-btn" id="menuBtn" aria-label="Ouvrir le menu">☰</button>
</header>

<main>

  <section class="welcome">
    <h1>Découvrez le Web.</h1>
    <p>Trouvez des sites et applications PWA créés par des développeurs indépendants.</p>
  </section>

  <section class="search">
    <input id="search" class="search-box" type="search" placeholder="Rechercher un projet...">
  </section>

  <section>
    <div class="categories" id="categoryList">
      <button class="category active" data-slug="all">Tous</button>
    </div>
  </section>

  <section class="section" id="featuredSection" hidden>
    <div class="section-header">
      <h2>À la une</h2>
    </div>
    <div class="projects" id="featuredList"></div>
  </section>

  <section class="section">
    <div class="section-header">
      <h2>Projets</h2>
    </div>

    <div class="projects" id="projectList"></div>

    <div class="empty" id="empty">Chargement des projets…</div>
  </section>

</main>

<footer>
  WEB STORE
  <br><br>
  by <strong>DEKAL HOUSE</strong>
</footer>

<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/app.js"></script>
</body>
</html>
