<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mot de passe oublié — WEB STORE Dev</title>
<meta name="theme-color" content="#12291B">
<link rel="manifest" href="../manifest.json">
<link rel="icon" href="../icons/icon-192.png">
<link rel="stylesheet" href="../css/style.css">
</head>
<body>
<div class="auth-wrap">
  <div class="auth-card">
    <div class="auth-logo">WEB<span>STORE</span> · Dev</div>
    <h1>Mot de passe oublié</h1>
    <p class="subtitle">Recevez un code pour réinitialiser votre mot de passe.</p>

    <div id="formMessage"></div>

    <form id="forgotForm">
      <div class="field">
        <label for="email">E-mail</label>
        <input type="email" id="email" required>
      </div>
      <button type="submit" class="btn" id="submitBtn">Envoyer le code</button>
    </form>

    <p class="auth-links"><a href="login.html">Retour à la connexion</a></p>
  </div>
</div>

<script src="../js/config.js"></script>
<script src="../js/api.js"></script>
<script>
  document.getElementById("forgotForm").addEventListener("submit", async (event) => {
    event.preventDefault();
    const submitBtn = document.getElementById("submitBtn");
    const messageBox = document.getElementById("formMessage");
    const email = document.getElementById("email").value.trim();
    submitBtn.disabled = true;

    // Message générique dans tous les cas : on ne révèle jamais si l'adresse existe.
    try {
      await WebStoreDevAPI.requestPasswordReset(email);
    } catch (err) {
      // ignoré volontairement
    }

    messageBox.innerHTML = `<div class="form-message success">
      Si un compte existe pour cette adresse, un code de réinitialisation vient d'être envoyé.
    </div>`;
    setTimeout(() => {
      window.location.href = `reset-password.html?email=${encodeURIComponent(email)}`;
    }, 1500);
  });
</script>
</body>
</html>
