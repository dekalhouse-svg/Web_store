<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#16A34A"><title>Détails du projet — WEB STORE Dev</title><link rel="manifest" href="../manifest.json"><link rel="icon" href="../icons/icon-192.png"><link rel="stylesheet" href="../css/style.css"><style>
.page-intro{color:#64748b;line-height:1.6;margin:0 0 22px;font-size:13px}.page-toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:18px}.page-toolbar select,.page-toolbar input{max-width:220px}.data-list{display:grid;gap:10px}.data-row{border:1px solid #e2e8f0;border-radius:12px;padding:14px;background:#fff}.data-row h3{font-size:14px;margin-bottom:6px}.data-row p{font-size:13px;line-height:1.6;color:#475569;white-space:pre-wrap}.muted{color:#64748b;font-size:12px}.pill{display:inline-block;border-radius:30px;padding:4px 9px;background:#f1f5f9;color:#475569;font-size:11px;font-weight:650}.pill.green{background:#dcfce7;color:#166534}.notice{padding:13px 15px;border-radius:11px;background:#f0fdf4;color:#166534;font-size:13px;line-height:1.55}.table-wrap{overflow-x:auto}.table-wrap table{min-width:560px}.empty-state{line-height:1.6}
</style></head><body><div class="app-shell"><aside class="sidebar" id="sidebar"><div class="sidebar-logo">WEB<span>STORE</span></div><nav class="sidebar-nav" aria-label="Navigation principale">
<a href="dashboard.html">Vue générale</a><a href="projects.html">Mes projets</a><a href="project-form.html">Publier un projet</a><a href="statistics.html">Statistiques</a><a href="comments.html">Commentaires</a><a href="messages.html">Messages</a><a href="notifications.html">Notifications</a><a href="profile.html">Mon profil</a><a href="settings.html">Paramètres et sécurité</a><a href="help.html">Centre d'aide</a>
</nav><div class="sidebar-footer"><button class="sidebar-logout" id="logoutBtn" type="button">Se déconnecter</button></div></aside><main class="content"><header class="topbar"><button class="menu-toggle" id="menuToggle" type="button" aria-label="Ouvrir le menu">☰</button><div class="topbar-title">Détails du projet</div><div></div></header><div class="page"><h1>Détails du projet</h1><p class="page-intro">Consultez les informations et le statut de l’un de vos projets.</p><div id="projectDetail" class="card empty-state">Chargement du projet…</div></div></main></div><script src="../js/config.js"></script><script src="../js/api.js"></script><script src="../js/auth.js"></script><script src="../js/dev-shell.js"></script><script>
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
(async()=>{const id=new URLSearchParams(location.search).get("id"),box=document.getElementById("projectDetail");if(!id){box.textContent="Identifiant de projet manquant.";return;}try{const p=await WebStoreDevAPI.getProject(id);box.className="card";box.innerHTML=`<div style="display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;align-items:flex-start"><div><h2>${esc(p.name)}</h2><p class="muted">${esc(p.type||"WEB")} · ${esc(p.category||"Sans catégorie")}</p></div><span class="pill">${esc(p.status||"Statut inconnu")}</span></div><p style="margin:18px 0;line-height:1.7">${esc(p.description||"Aucune description.")}</p><p class="muted">Adresse : <a href="${esc(p.url)}" target="_blank" rel="noopener noreferrer">${esc(p.url)}</a></p><div class="page-toolbar" style="margin-top:20px"><a class="btn btn-inline" href="project-form.html?id=${encodeURIComponent(p.id)}">Modifier le projet</a><a class="btn btn-outline btn-inline" href="project-stats.html?id=${encodeURIComponent(p.id)}">Voir les statistiques</a><a class="btn btn-outline btn-inline" href="projects.html">Retour aux projets</a></div>`;}catch(e){box.textContent=e.message||"Impossible de charger ce projet."}})();
</script></body></html>
