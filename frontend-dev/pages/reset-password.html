<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Réinitialiser le mot de passe — WEB STORE Dev</title>
<meta name="theme-color" content="#12291B">
<link rel="manifest" href="../manifest.json">
<link rel="icon" href="../icons/icon-192.png">
<link rel="stylesheet" href="../css/style.css">
</head>
<body>
<div class="auth-wrap">
  <div class="auth-card">
    <div class="auth-logo">WEB<span>STORE</span> · Dev</div>
    <h1>Nouveau mot de passe</h1>
    <p class="subtitle">Saisissez le code reçu par e-mail et votre nouveau mot de passe.</p>

    <div id="formMessage"></div>

    <form id="resetForm">
      <div class="field">
        <label for="code">Code reçu par e-mail</label>
        <input type="text" id="code" inputmode="numeric" maxlength="6" required>
      </div>
      <div class="field">
        <label for="password">Nouveau mot de passe</label>
        <input type="password" id="password" minlength="8" required>
      </div>
      <button type="submit" class="btn" id="submitBtn">Réinitialiser</button>
    </form>

    <p class="auth-links"><a href="login.html">Retour à la connexion</a></p>
  </div>
</div>

<script src="../js/config.js"></script>
<script src="../js/api.js"></script>
<script>
  const email = new URLSearchParams(window.location.search).get("email") || "";

  document.getElementById("resetForm").addEventListener("submit", async (event) => {
    event.preventDefault();
    const submitBtn = document.getElementById("submitBtn");
    const messageBox = document.getElementById("formMessage");
    messageBox.innerHTML = "";
    submitBtn.disabled = true;

    try {
      await WebStoreDevAPI.confirmPasswordReset({
        email,
        code: document.getElementById("code").value.trim(),
        new_password: document.getElementById("password").value,
      });
      messageBox.innerHTML = `<div class="form-message success">Mot de passe mis à jour. Vous pouvez vous connecter.</div>`;
      setTimeout(() => (window.location.href = "login.html"), 1200);
    } catch (err) {
      messageBox.innerHTML = `<div class="form-message error">${err.message}</div>`;
      submitBtn.disabled = false;
    }
  });
</script>
</body>
</html>
