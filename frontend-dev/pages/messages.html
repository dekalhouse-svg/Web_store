<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Messages — WEB STORE Dev</title><meta name="theme-color" content="#12291B">
<link rel="manifest" href="../manifest.json"><link rel="icon" href="../icons/icon-192.png"><link rel="stylesheet" href="../css/style.css">
<style>
.message-list{display:grid;gap:9px}.message-row{display:flex;align-items:center;gap:13px;width:100%;padding:15px;text-align:left;background:var(--color-surface);border:1px solid var(--color-border);border-radius:12px;color:var(--color-text);cursor:pointer}.message-row:hover{border-color:var(--color-accent);background:var(--color-surface-alt)}.message-row.unread{border-left:4px solid var(--color-accent)}.message-main{min-width:0;flex:1}.message-top{display:flex;justify-content:space-between;gap:10px;align-items:center}.message-sender{font-size:13px;font-weight:700}.message-subject{display:block;font-size:13px;margin-top:5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.message-preview{display:block;color:var(--color-text-muted);font-size:12px;margin-top:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.message-date{font-size:10px;color:var(--color-text-muted);white-space:nowrap}.message-state{font-size:10px;color:var(--color-accent);font-weight:700;white-space:nowrap}.message-empty{padding:30px;text-align:center;color:var(--color-text-muted)}
</style>
</head><body><div class="app-shell">
<aside class="sidebar" id="sidebar"><div class="sidebar-logo">WEB<span>STORE</span></div><nav class="sidebar-nav" aria-label="Navigation principale">
<a href="dashboard.html">Vue générale</a><a href="projects.html">Mes projets</a><a href="project-form.html">Publier un projet</a><a href="statistics.html">Statistiques</a><a href="comments.html">Commentaires</a><a href="messages.html">Messages</a><a href="notifications.html">Notifications</a><a href="profile.html">Mon profil</a><a href="settings.html">Paramètres et sécurité</a><a href="help.html">Centre d'aide</a></nav><div class="sidebar-footer"><button class="sidebar-logout" id="logoutBtn">Se déconnecter</button></div></aside>
<div class="content"><header class="topbar"><button class="menu-toggle" id="menuToggle">☰</button><div class="topbar-title">Messages</div><div></div></header><main class="page"><section class="card"><div class="card-header"><div><h2>Boîte de réception</h2><p class="muted">Sélectionnez un message pour lire son contenu et répondre.</p></div><button class="btn-outline btn-inline btn" id="refreshMessages" type="button">Actualiser</button></div><div id="messageList" class="message-list"><div class="message-empty">Chargement des messages…</div></div></section></main></div></div>
<script src="../js/config.js"></script><script src="../js/api.js"></script><script src="../js/auth.js"></script>
<script>
(async()=>{
 const list=document.getElementById('messageList'); const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 const fmt=v=>{const d=new Date(v);return Number.isNaN(d.getTime())?'':d.toLocaleDateString('fr-FR',{day:'2-digit',month:'short',year:'numeric'});};
 async function load(){list.innerHTML='<div class="message-empty">Chargement des messages…</div>';try{const rows=await WebStoreDevAPI.getMessages();if(!Array.isArray(rows))throw Error('Réponse invalide');if(!rows.length){list.innerHTML='<div class="message-empty">Aucun message pour le moment.</div>';return;}list.innerHTML=rows.map(m=>`<button class="message-row ${m.read?'':'unread'}" type="button" data-id="${Number(m.id)}"><span class="message-main"><span class="message-top"><span class="message-sender">${esc(m.sender_name||'Administration')}</span><span class="message-date">${esc(fmt(m.created_at))}</span></span><span class="message-subject">${esc(m.subject||'(Sans sujet)')}</span><span class="message-preview">${esc(m.content||'')}</span></span><span class="message-state">${m.read?'Lu':'Nouveau'}</span></button>`).join('');}catch(e){list.innerHTML='<div class="message-empty">Impossible de charger les messages. Réessayez.</div>';}}
 list.addEventListener('click',e=>{const b=e.target.closest('[data-id]');if(b)location.href=`message-detail.html?id=${encodeURIComponent(b.dataset.id)}`;});
 document.getElementById('refreshMessages').addEventListener('click',load);
 const requested=new URLSearchParams(location.search).get('id');if(requested)location.replace(`message-detail.html?id=${encodeURIComponent(requested)}`);else await load();
})();
</script><script src="../js/dev-shell.js"></script></body></html>
