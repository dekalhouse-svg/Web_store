<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Messages — WEB STORE Dev</title>
<meta name="theme-color" content="#12291B">
<link rel="manifest" href="../manifest.json">
<link rel="icon" href="../icons/icon-192.png">
<link rel="stylesheet" href="../css/style.css">

<style id="messages-full-width-fix">
/* La liste utilise toute la largeur disponible, sans limite de .page. */
.app-shell, .content { min-width:0; }
.content { width:calc(100% - 240px); }
.page { width:100%; max-width:none; padding:0 !important; margin:0; box-sizing:border-box; }
#inboxCard { width:100%; max-width:none; margin:0; padding:14px 18px !important; border-left:0; border-right:0; border-radius:0; box-shadow:none; box-sizing:border-box; }
#messageList { width:100%; min-width:0; max-width:none; box-sizing:border-box; }
#messageList .message-item {
  display:grid; grid-template-columns:minmax(0,1fr) max-content; align-items:center;
  gap:12px; width:100%; min-width:0; max-width:none; box-sizing:border-box;
}
#messageList .message-item .subject { min-width:0; overflow-wrap:anywhere; word-break:break-word; line-height:1.45; }
#messageList .message-item .meta { white-space:nowrap; text-align:right; }
@media(max-width:860px) {
  .content { width:100%; }
}
@media(max-width:520px) {
  .page { padding:0 !important; }
  #inboxCard { padding:10px 14px !important; }
  #messageList .message-item { grid-template-columns:minmax(0,1fr) auto; gap:8px; padding:15px 5px; }
  #messageList .message-item .subject { font-size:15px; }
  #messageList .message-item .meta { max-width:88px; font-size:11px; }
}
</style>

</head>
<body>
<div class="app-shell">

  <aside class="sidebar" id="sidebar">
    <div class="sidebar-logo">WEB<span>STORE</span></div>
    <nav class="sidebar-nav" aria-label="Navigation principale">
<a href="dashboard.html">Vue générale</a>
<a href="projects.html">Mes projets</a>
<a href="project-form.html">Publier un projet</a>
<a href="statistics.html">Statistiques</a>
<a href="comments.html">Commentaires</a>
<a href="messages.html">Messages</a>
<a href="notifications.html">Notifications</a>
<a href="profile.html">Mon profil</a>
<a href="settings.html">Paramètres et sécurité</a>
<a href="help.html">Centre d'aide</a>
</nav>
    <div class="sidebar-footer">
      <button class="sidebar-logout" id="logoutBtn">Se déconnecter</button>
    </div>
  </aside>

  <div class="content">
    <div class="topbar">
      <button class="menu-toggle" id="menuToggle">☰</button>
      <div class="topbar-title">Messages</div>
      <div></div>
    </div>

    <div class="page">
      <div class="card" id="inboxCard">
        <div id="messageList" class="empty-state">chargement...</div>
      </div>
  </div>
</div>

<script src="../js/config.js"></script>
<script src="../js/api.js"></script>
<script src="../js/auth.js"></script>
<script>
  loadMessages();

  async function loadMessages() {
    const list = document.getElementById("messageList");
    try {
      const messages = await WebStoreDevAPI.getMessages();
      if (messages.length === 0) return;

      list.className = "";
      list.innerHTML = messages
        .map(
          (m) => `
          <div class="message-item ${m.read ? "" : "unread"}" onclick="openMessage(${m.id})">
            <div class="subject">${escapeHtml(m.subject)}</div>
            <div class="meta">${new Date(m.created_at).toLocaleDateString("fr-FR")}</div>
          </div>`
        )
        .join("");
      const requestedId = new URLSearchParams(window.location.search).get("id");
      if (requestedId && !window.__webstoreDeepLinkOpened && messages.some(m => String(m.id) === requestedId)) {
        window.__webstoreDeepLinkOpened = true;
        await openMessage(requestedId);
      }
    } catch (err) {
      list.textContent = "Impossible de charger vos messages pour le moment.";
    }
  }

  function openMessage(id) {
    // La lecture du message reste sur sa page dédiée.
    window.location.href = "message-detail.html?id=" + encodeURIComponent(id);
  }



  function escapeHtml(value){return String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
</script>
<script src="../js/dev-shell.js"></script>
</body>
</html>
