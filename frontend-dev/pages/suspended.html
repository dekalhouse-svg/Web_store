<!DOCTYPE html>
<html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Compte suspendu — WEB STORE</title><meta name="theme-color" content="#12291B"><link rel="stylesheet" href="../css/style.css">
<style>
.suspension-wrap{min-height:100vh;display:grid;place-items:center;padding:22px;background:radial-gradient(circle at top,#3b241c,#101510 62%)}
.suspension-card{width:min(100%,650px);background:var(--color-surface);border:1px solid var(--color-border);border-radius:20px;padding:clamp(22px,5vw,38px);box-shadow:0 24px 70px #0005}
.suspension-mark{width:48px;height:48px;border-radius:14px;background:#4b261f;color:#ffb4a8;display:grid;place-items:center;font-size:25px;margin-bottom:20px}
.suspension-card h1{font-size:clamp(23px,4vw,30px);margin-bottom:9px}.suspension-card .lead{color:var(--color-text-muted);line-height:1.6;margin-bottom:22px}
.reason-box{border:1px solid var(--color-border);background:var(--color-surface-alt);border-radius:12px;padding:16px;margin:18px 0 22px}.reason-box strong{display:block;font-size:12px;color:var(--color-text-muted);margin-bottom:8px}.reason-box p{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.6}
.suspension-card textarea{width:100%;min-height:110px;max-height:320px;resize:none;overflow-y:auto;border:1px solid var(--color-border);border-radius:11px;padding:13px;background:var(--color-surface-alt);color:var(--color-text);font:inherit;line-height:1.5;outline:none}.suspension-card textarea:focus{border-color:var(--color-accent)}
.suspension-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}.suspension-actions .btn{flex:1;min-width:150px}.suspension-status{font-size:13px;margin-top:14px;color:var(--color-text-muted);line-height:1.5}.suspension-status.pending{color:#fbbf24}
</style></head><body><main class="suspension-wrap"><section class="suspension-card"><div class="suspension-mark" aria-hidden="true">!</div><h1>Votre compte a été suspendu</h1><p class="lead">L'accès à votre espace développeur est temporairement désactivé. Consultez le motif communiqué par l'administration.</p><div class="reason-box"><strong>MOTIF DE LA SUSPENSION</strong><p id="suspensionReason">Chargement…</p></div><div id="appealArea"><div class="suspension-actions" id="choiceActions"><button class="btn" id="protestBtn" type="button">Protester</button><button class="btn btn-outline" id="acceptBtn" type="button">Accepter la suspension</button></div><div id="appealComposer" hidden><label class="field"><span style="display:block;font-size:13px;font-weight:600;margin-bottom:8px">Votre message de justification</span><textarea id="appealMessage" maxlength="5000" placeholder="Expliquez clairement pourquoi vous contestez cette décision…"></textarea></label><div class="suspension-actions"><button class="btn" id="sendAppealBtn" type="button">Envoyer ma contestation</button><button class="btn btn-outline" id="cancelAppealBtn" type="button">Annuler</button></div></div></div><p class="suspension-status" id="statusMessage" role="status" aria-live="polite"></p><p class="auth-links" style="margin-top:22px"><a href="login.html" id="backLogin">Retour à la connexion</a></p></section></main>
<script src="../js/config.js"></script><script src="../js/api.js"></script><script>
const email=sessionStorage.getItem('webstore_suspended_email')||'';const reason=sessionStorage.getItem('webstore_suspension_reason')||'Aucun motif communiqué.';const previousStatus=sessionStorage.getItem('webstore_appeal_status')||'AUCUNE';const previousMessage=sessionStorage.getItem('webstore_appeal_message')||'';
document.getElementById('suspensionReason').textContent=reason;const textarea=document.getElementById('appealMessage');textarea.value=previousMessage;function grow(){textarea.style.height='auto';textarea.style.height=Math.min(textarea.scrollHeight,320)+'px'}textarea.addEventListener('input',grow);grow();
const status=document.getElementById('statusMessage');const choice=document.getElementById('choiceActions');const composer=document.getElementById('appealComposer');if(previousStatus==='EN_ATTENTE'){status.textContent='Votre contestation a déjà été envoyée. Elle reste en attente de décision de l’administration.';status.classList.add('pending');choice.hidden=true;}else if(previousStatus==='ACCEPTEE'){status.textContent='Vous avez déjà accepté la suspension. Vous pouvez revenir à la connexion.';choice.hidden=true;}
document.getElementById('protestBtn').addEventListener('click',()=>{choice.hidden=true;composer.hidden=false;textarea.focus()});document.getElementById('cancelAppealBtn').addEventListener('click',()=>{composer.hidden=true;choice.hidden=false});
async function send(action){const password=window.prompt('Pour confirmer votre identité, saisissez votre mot de passe :');if(password===null)return;const buttons=document.querySelectorAll('#appealArea button');buttons.forEach(b=>b.disabled=true);try{const result=await WebStoreDevAPI.submitSuspensionAppeal({email,password,action,message:textarea.value.trim()});status.textContent=result.message||'Action enregistrée.';status.className='suspension-status';if(action==='protest'){status.classList.add('pending');composer.hidden=true;textarea.disabled=true;}else{choice.hidden=true;composer.hidden=true;} }catch(error){status.textContent=error.message||'Impossible d’enregistrer votre réponse.';buttons.forEach(b=>b.disabled=false)}}
document.getElementById('sendAppealBtn').addEventListener('click',()=>send('protest'));document.getElementById('acceptBtn').addEventListener('click',()=>{if(confirm('Confirmez-vous que vous prenez connaissance de la suspension et acceptez cette décision ?'))send('accept')});
</script></body></html>
