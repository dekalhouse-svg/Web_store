<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Connexion — WEB STORE Dev</title>
<meta name="theme-color" content="#12291B">
<link rel="manifest" href="../manifest.json">
<link rel="icon" href="../icons/icon-192.png">
<link rel="stylesheet" href="../css/style.css">

<style>
.password-input-wrap{position:relative;width:100%;display:block}
.password-input-wrap input[type="password"],
.password-input-wrap input[type="text"]{box-sizing:border-box;width:100%;padding-right:48px!important}
.password-toggle{position:absolute;top:50%;right:8px;transform:translateY(-50%);width:34px;height:34px;padding:0;border:0;border-radius:7px;background:transparent;color:#64748b;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;z-index:2}
.password-toggle:hover{background:rgba(100,116,139,.10);color:#1e293b}
.password-toggle:focus-visible{outline:2px solid #64748b;outline-offset:1px}
.password-toggle svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.password-toggle .password-eye-hide{display:none}
.password-toggle[aria-pressed="true"] .password-eye-show{display:none}
.password-toggle[aria-pressed="true"] .password-eye-hide{display:block}
</style>
</head>
<body>
<div class="auth-wrap">
  <div class="auth-card">
    <div class="auth-logo">WEB<span>STORE</span> · Dev</div>
    <h1>Connexion</h1>
    <p class="subtitle">Accédez à votre dashboard développeur.</p>

    <div id="formMessage"></div>

    <form id="loginForm">
      <div class="field">
        <label for="email">E-mail</label>
        <input type="email" id="email" required>
      </div>
      <div class="field">
        <label for="password">Mot de passe</label>
        <div class="password-input-wrap"><input type="password" id="password" required><button class="password-toggle" type="button" aria-label="Afficher le mot de passe" aria-pressed="false" title="Afficher le mot de passe">
<svg class="password-eye-show" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>
<svg class="password-eye-hide" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="m3 3 18 18M10.6 10.6a2 2 0 0 0 2.8 2.8"/><path d="M9.9 5.2A10.8 10.8 0 0 1 12 5c6.4 0 10 7 10 7a16 16 0 0 1-3.1 3.8M6.2 6.2C3.5 8 2 12 2 12s3.6 7 10 7a10 10 0 0 0 4-.8"/></svg>
</button></div>
      </div>
      <button type="submit" class="btn" id="submitBtn">Se connecter</button>
    </form>

    <p class="auth-links">
      <a href="forgot-password.html">Mot de passe oublié ?</a>
    </p>
    <p class="auth-links">
      E-mail non vérifié ? <a href="#" id="resendVerificationLink">Renvoyer le code</a>
    </p>
    <p class="auth-links">
      Pas encore de compte ? <a href="register.html">Créer un compte</a>
    </p>
  </div>
</div>

<script src="../js/config.js"></script>
<script src="../js/api.js"></script>
<script>
  document.getElementById("loginForm").addEventListener("submit", async (event) => {
    event.preventDefault();
    const submitBtn = document.getElementById("submitBtn");
    const messageBox = document.getElementById("formMessage");
    messageBox.innerHTML = "";
    submitBtn.disabled = true;

    try {
      await WebStoreDevAPI.login({
        email: document.getElementById("email").value.trim(),
        password: document.getElementById("password").value,
      });
      window.location.href = "dashboard.html";
    } catch (err) {
      messageBox.innerHTML = `<div class="form-message error">${String(err.message || "Identifiants invalides.").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}</div>`;
      submitBtn.disabled = false;
    }
  });
  document.getElementById("resendVerificationLink").addEventListener("click", async (event) => {
    event.preventDefault();
    const email = document.getElementById("email").value.trim();
    const messageBox = document.getElementById("formMessage");
    if (!email) {
      messageBox.textContent = "Saisissez d'abord votre adresse e-mail.";
      return;
    }
    try {
      await WebStoreDevAPI.resendVerificationCode(email);
      window.location.href = `verify-email.html?email=${encodeURIComponent(email)}`;
    } catch (err) {
      messageBox.textContent = err.message || "Impossible de renvoyer le code.";
    }
  });
</script>

<script>
document.querySelectorAll(".password-input-wrap").forEach((wrap) => {
  const input = wrap.querySelector("input");
  const button = wrap.querySelector(".password-toggle");
  if (!input || !button) return;

  button.addEventListener("click", () => {
    const willShow = input.type === "password";
    input.type = willShow ? "text" : "password";
    button.setAttribute("aria-pressed", String(willShow));
    button.setAttribute("aria-label", willShow ? "Masquer le mot de passe" : "Afficher le mot de passe");
    button.setAttribute("title", willShow ? "Masquer le mot de passe" : "Afficher le mot de passe");
    input.focus();
  });
});
</script>
</body>
</html>
