<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Connexion — WEB STORE Dev</title>
<meta name="theme-color" content="#12291B">
<link rel="manifest" href="../manifest.json">
<link rel="icon" href="../icons/icon-192.png">
<link rel="stylesheet" href="../css/style.css">


  <style>
.chec {
    display: inline-block;
    font-size: 14px;
    margin-top: 10px;
    margin-right: 5px;
}

.check {
    width: 16px;
    height: 16px;
    vertical-align: middle;
    margin: 0;
    cursor: pointer;
    accent-color: #2563eb;
}
  </style>
</head>
<body>
<div class="auth-wrap">
  <div class="auth-card">
    <div class="auth-logo">WEB<span>STORE</span> · Dev</div>
    <h1>Connexion</h1>
    <p class="subtitle">Accédez à votre dashboard développeur.</p>

    <div id="formMessage"></div>

    <form id="loginForm">
      <div class="field">
        <label for="email">E-mail</label>
        <input type="email" id="email" required>
      </div>
      <div class="field">
        <label for="password">Mot de passe</label>
        <input type="password" id="password" required>
                <label class= 'chec'>afficher</label>
         <input type="checkbox" name="" id="c" value="" />
      </div>
      <button type="submit" class="btn" id="submitBtn">Se connecter</button>
    </form>

    <p class="auth-links">
      <a href="forgot-password.html">Mot de passe oublié ?</a>
    </p>
    <p class="auth-links">
      E-mail non vérifié ? <a href="#" id="resendVerificationLink">Renvoyer le code</a>
    </p>
    <p class="auth-links">
      Pas encore de compte ? <a href="register.html">Créer un compte</a>
    </p>
  </div>
</div>

<script src="../js/config.js"></script>
<script src="../js/api.js"></script>
<script>
  document.getElementById("loginForm").addEventListener("submit", async (event) => {
    event.preventDefault();
    const submitBtn = document.getElementById("submitBtn");
    const messageBox = document.getElementById("formMessage");
    messageBox.innerHTML = "";
    submitBtn.disabled = true;

    try {
      await WebStoreDevAPI.login({
        email: document.getElementById("email").value.trim(),
        password: document.getElementById("password").value,
      });
      window.location.href = "dashboard.html";
    } catch (err) {
      messageBox.innerHTML = `<div class="form-message error">${String(err.message || "Identifiants invalides.").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}</div>`;
      submitBtn.disabled = false;
    }
  });
  document.getElementById("resendVerificationLink").addEventListener("click", async (event) => {
    event.preventDefault();
    const email = document.getElementById("email").value.trim();
    const messageBox = document.getElementById("formMessage");
    if (!email) {
      messageBox.textContent = "Saisissez d'abord votre adresse e-mail.";
      return;
    }
    try {
      await WebStoreDevAPI.resendVerificationCode(email);
      window.location.href = `verify-email.html?email=${encodeURIComponent(email)}`;
    } catch (err) {
      messageBox.textContent = err.message || "Impossible de renvoyer le code.";
    }
  });

  let b = document.getElementById('c')
  let p = document.getElementById('password')
  b.addEventListener('click', function (){
   if (p.type === 'text') {
    p.type = 'password'
    
   }
   else{
    p.type = 'text'
    
   }
  })
</script>
</body>
</html>
