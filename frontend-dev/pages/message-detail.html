<!DOCTYPE html>
<html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Message — WEB STORE Dev</title><meta name="theme-color" content="#12291B"><link rel="manifest" href="../manifest.json"><link rel="icon" href="../icons/icon-192.png"><link rel="stylesheet" href="../css/style.css">
<style>.detail-card{max-width:850px;margin:auto}.detail-actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:20px}.detail-meta{font-size:12px;color:var(--color-text-muted);padding-bottom:15px;border-bottom:1px solid var(--color-border)}.detail-content{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.75;font-size:14px;padding:22px 0;min-height:100px}.detail-subject{font-size:21px;overflow-wrap:anywhere}.detail-card[hidden]{display:none!important}</style></head>
<body><div class="app-shell"><aside class="sidebar" id="sidebar"><div class="sidebar-logo">WEB<span>STORE</span></div><nav class="sidebar-nav"><a href="dashboard.html">Vue générale</a><a href="projects.html">Mes projets</a><a href="project-form.html">Publier un projet</a><a href="statistics.html">Statistiques</a><a href="comments.html">Commentaires</a><a href="messages.html">Messages</a><a href="notifications.html">Notifications</a><a href="profile.html">Mon profil</a><a href="settings.html">Paramètres et sécurité</a><a href="help.html">Centre d'aide</a></nav><div class="sidebar-footer"><button class="sidebar-logout" id="logoutBtn">Se déconnecter</button></div></aside>
<div class="content"><header class="topbar"><button class="menu-toggle" id="menuToggle">☰</button><div class="topbar-title">Lecture du message</div><div></div></header><main class="page"><section class="card detail-card" id="detailCard"><div class="card-header"><h2 class="detail-subject" id="subject">Chargement…</h2></div><div class="detail-meta" id="meta"></div><div class="detail-content" id="content"></div><div class="detail-actions"><button class="btn-outline btn-inline btn" id="backBtn" type="button">← Retour aux messages</button><button class="btn btn-inline" id="replyBtn" type="button">Répondre</button><button class="btn-outline btn-inline btn" id="deleteBtn" type="button">Supprimer</button></div><form id="replyForm" class="form-grid" hidden style="margin-top:18px"><label for="replyContent">Votre réponse</label><textarea id="replyContent" rows="4" maxlength="10000" required placeholder="Écrivez votre réponse…"></textarea><div class="form-actions"><button class="btn btn-inline" type="submit" id="sendReply">Envoyer la réponse</button><button class="btn-outline btn-inline btn" id="cancelReply" type="button">Annuler</button></div></form><p id="status" role="status" style="font-size:12px;color:var(--color-text-muted)"></p></section></main></div></div>
<script src="../js/config.js"></script><script src="../js/api.js"></script><script src="../js/auth.js"></script><script>
(async()=>{const id=new URLSearchParams(location.search).get('id');const $=x=>document.getElementById(x);let message=null;if(!id){$('subject').textContent='Message introuvable';return;}const back=()=>location.href='messages.html';$('backBtn').onclick=back;$('replyBtn').onclick=()=>{$('replyForm').hidden=!$('replyForm').hidden;if(!$('replyForm').hidden)$('replyContent').focus();};$('cancelReply').onclick=()=>{$('replyForm').hidden=true;$('replyContent').value='';};
try{message=await WebStoreDevAPI.getMessage(id);$('subject').textContent=message.subject||'(Sans sujet)';$('meta').textContent=`De : ${message.sender_name||'Administration'}${message.sender_email?' · '+message.sender_email:''} · ${new Date(message.created_at).toLocaleString('fr-FR')}`;$('content').textContent=message.content||'';if(!message.read)await WebStoreDevAPI.markMessageRead(id);}catch(e){$('subject').textContent='Impossible d’ouvrir ce message';$('content').textContent='Vérifiez votre connexion puis réessayez.';$('replyBtn').disabled=true;$('deleteBtn').disabled=true;}
$('replyForm').addEventListener('submit',async e=>{e.preventDefault();const content=$('replyContent').value.trim();if(!content)return;$('sendReply').disabled=true;try{await WebStoreDevAPI.replyToMessage(id,content);$('replyContent').value='';$('replyForm').hidden=true;$('status').textContent='Réponse envoyée.';}catch(e){$('status').textContent='Impossible d’envoyer la réponse.';}finally{$('sendReply').disabled=false;}});
$('deleteBtn').addEventListener('click',async()=>{if(!confirm('Supprimer définitivement ce message ?'))return;$('deleteBtn').disabled=true;try{await WebStoreDevAPI.deleteMessage(id);back();}catch(e){$('status').textContent='Impossible de supprimer ce message.';$('deleteBtn').disabled=false;}});
})();</script><script src="../js/dev-shell.js"></script></body></html>
