<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Message — WEB STORE Dev</title><meta name="theme-color" content="#12291B">
<link rel="manifest" href="../manifest.json"><link rel="icon" href="../icons/icon-192.png"><link rel="stylesheet" href="../css/style.css">
<style>
.detail-page{width:100%;max-width:none;padding:0!important}
.chat-panel{width:100%;height:calc(100vh - 64px);min-height:460px;display:flex;flex-direction:column;background:#f5f6f8;border:0;border-radius:0;overflow:hidden}
.chat-header{height:66px;flex:none;display:flex;align-items:center;gap:12px;padding:0 18px;background:var(--color-surface);border-bottom:1px solid var(--color-border)}
.chat-back{border:0;background:transparent;color:var(--color-text);font-size:27px;cursor:pointer}
.chat-avatar{width:40px;height:40px;flex:none;display:grid;place-items:center;border-radius:50%;background:#e6ece7;color:#315c42;font-weight:650}
.chat-sender{min-width:0;font-size:15px;font-weight:650;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chat-menu-wrap{position:relative;margin-left:auto}.chat-menu-button{width:38px;height:38px;border:0;border-radius:50%;background:transparent;color:var(--color-text);font-size:25px;cursor:pointer}
.chat-menu{position:absolute;z-index:5;right:0;top:43px;width:145px;padding:5px;background:#fff;border:1px solid var(--color-border);border-radius:10px;box-shadow:0 8px 24px #0002}.chat-menu[hidden]{display:none}
.chat-menu button{width:100%;padding:11px 12px;border:0;border-radius:7px;background:transparent;text-align:left;color:#b83232;font-size:13px;cursor:pointer}
.chat-body{flex:1;min-height:0;overflow-y:auto;padding:22px clamp(14px,5vw,64px);display:flex;flex-direction:column;gap:12px}
.chat-date{align-self:center;margin:2px 0 12px;color:#929ba5;font-size:11px}
.chat-bubble{max-width:min(82%,680px);padding:12px 15px;background:#fff;border:1px solid #e9ecef;border-radius:17px 17px 17px 5px;color:#27313b;font-size:14px;line-height:1.65;white-space:pre-wrap;overflow-wrap:anywhere;box-shadow:0 1px 2px #00000008}
.chat-bubble.mine{align-self:flex-end;background:#dcefe4;border-color:#dcefe4;border-radius:17px 17px 5px 17px}
.chat-meta{font-size:10px;color:#929ba5;margin-top:6px;text-align:right}
.chat-composer{flex:none;display:flex;align-items:flex-end;gap:10px;padding:12px 14px;background:var(--color-surface);border-top:1px solid var(--color-border)}
.chat-composer textarea{flex:1;min-width:0;max-height:130px;min-height:43px;resize:vertical;padding:11px 15px;border:1px solid var(--color-border);border-radius:22px;background:#fafbfa;color:var(--color-text);font:inherit;font-size:14px;outline:none}
.chat-composer textarea:focus{border-color:var(--color-primary)}.chat-send{width:43px;height:43px;flex:none;border:0;border-radius:50%;background:var(--color-primary);color:#fff;font-size:17px;cursor:pointer}.chat-send:disabled{opacity:.55;cursor:wait}
.chat-status{flex:none;padding:0 16px 8px;background:var(--color-surface);color:var(--color-text-muted);font-size:12px}.chat-status:empty{display:none}
@media(max-width:520px){.chat-header{height:62px;padding:0 12px}.chat-body{padding:18px 12px}.chat-bubble{max-width:90%}.chat-panel{height:calc(100dvh - 64px)}}

/* Le champ de réponse reste ancré au bas de la zone visible. */
.chat-panel { position:relative; height:100%; min-height:0; }
.chat-body { padding-bottom:90px; }
.chat-composer {
  position:fixed !important;
  left:240px;
  right:0;
  bottom:0;
  z-index:30;
  display:flex !important;
  width:auto;
  min-height:66px;
  box-sizing:border-box;
  padding:10px 14px calc(10px + env(safe-area-inset-bottom, 0px));
  background:var(--color-surface, #fff);
  border-top:1px solid var(--color-border, #e5e7eb);
}
.chat-composer textarea { min-height:43px; max-height:110px; resize:none; }
.chat-status:not(:empty) {
  position:fixed;
  left:240px;
  right:0;
  bottom:calc(66px + env(safe-area-inset-bottom, 0px));
  z-index:29;
  padding:6px 16px;
  background:var(--color-surface, #fff);
}
@media(max-width:860px) {
  .chat-composer { left:0; right:0; }
  .chat-status:not(:empty) { left:0; right:0; }
}
@media(max-width:520px) {
  .chat-composer {
    left:0;
    right:0;
    bottom:0;
    min-height:64px;
    gap:8px;
    padding:9px 12px calc(9px + env(safe-area-inset-bottom, 0px));
  }
  .chat-composer textarea { min-height:44px; max-height:110px; }
  .chat-body { padding-bottom:84px; }
  .chat-status:not(:empty) { bottom:calc(62px + env(safe-area-inset-bottom, 0px)); }
}
</style></head>
<body><div class="app-shell">
<aside class="sidebar" id="sidebar"><div class="sidebar-logo">WEB<span>STORE</span></div><nav class="sidebar-nav"><a href="dashboard.html">Vue générale</a><a href="projects.html">Mes projets</a><a href="project-form.html">Publier un projet</a><a href="statistics.html">Statistiques</a><a href="comments.html">Commentaires</a><a href="messages.html">Messages</a><a href="notifications.html">Notifications</a><a href="profile.html">Mon profil</a><a href="settings.html">Paramètres et sécurité</a><a href="help.html">Centre d'aide</a></nav><div class="sidebar-footer"><button class="sidebar-logout" id="logoutBtn">Se déconnecter</button></div></aside>
<div class="content"><header class="topbar"><button class="menu-toggle" id="menuToggle">☰</button><div class="topbar-title">Messages</div><div></div></header>
<main class="page detail-page"><section class="chat-panel">
<header class="chat-header"><button class="chat-back" id="backBtn" type="button" aria-label="Retour">‹</button><div class="chat-avatar" id="senderAvatar">A</div><div class="chat-sender" id="senderName">Chargement…</div><div class="chat-menu-wrap"><button class="chat-menu-button" id="menuBtn" type="button" aria-label="Options">⋮</button><div class="chat-menu" id="messageMenu" hidden><button type="button" id="deleteBtn">Supprimer</button></div></div></header>
<div class="chat-body" id="chatBody"><div class="chat-date" id="messageDate"></div><div class="chat-bubble" id="originalContent">Chargement…</div></div>
<form id="replyForm" class="chat-composer"><textarea id="replyContent" rows="1" maxlength="10000" required placeholder="Message"></textarea><button class="chat-send" type="submit" id="sendReply" aria-label="Envoyer">➤</button></form><div class="chat-status" id="status" role="status"></div>
</section></main></div></div>
<script src="../js/config.js"></script><script src="../js/api.js"></script><script src="../js/auth.js"></script>
<script>
(async()=>{
 const id=new URLSearchParams(location.search).get('id'),$=id=>document.getElementById(id);
 const back=()=>location.href='messages.html';$('backBtn').addEventListener('click',back);
 $('menuBtn').addEventListener('click',()=>{$('messageMenu').hidden=!$('messageMenu').hidden;});
 document.addEventListener('click',e=>{if(!e.target.closest('.chat-menu-wrap'))$('messageMenu').hidden=true;});
 if(!id){$('senderName').textContent='Message introuvable';$('originalContent').textContent='';$('replyForm').hidden=true;return;}
 function addBubble(content,date,mine){
   const bubble=document.createElement('div');bubble.className='chat-bubble'+(mine?' mine':'');
   bubble.appendChild(document.createTextNode(content||''));
   const meta=document.createElement('div');meta.className='chat-meta';
   const parsed=new Date(date);meta.textContent=Number.isNaN(parsed.getTime())?'':parsed.toLocaleString('fr-FR',{dateStyle:'short',timeStyle:'short'});
   bubble.appendChild(meta);$('chatBody').appendChild(bubble);
 }
 try{
   const message=await WebStoreDevAPI.getMessage(id);
   const sender=message.sender_name||'Administration';$('senderName').textContent=sender;$('senderAvatar').textContent=[...sender.trim()][0]?.toUpperCase()||'A';
   $('messageDate').textContent=new Date(message.created_at).toLocaleDateString('fr-FR');
   $('originalContent').textContent=message.content||'';
   const originalMeta=document.createElement('div');originalMeta.className='chat-meta';originalMeta.textContent=new Date(message.created_at).toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});$('originalContent').appendChild(originalMeta);
   (message.replies||[]).forEach(reply=>addBubble(reply.content,reply.created_at,Boolean(reply.is_mine)));
   if(!message.read)await WebStoreDevAPI.markMessageRead(id);
 }catch(e){$('senderName').textContent='Message indisponible';$('originalContent').textContent='Impossible de charger ce message.';$('replyContent').disabled=true;$('sendReply').disabled=true;$('menuBtn').disabled=true;return;}
 $('replyForm').addEventListener('submit',async e=>{
   e.preventDefault();const content=$('replyContent').value.trim();if(!content)return;
   $('sendReply').disabled=true;
   try{await WebStoreDevAPI.replyToMessage(id,content);addBubble(content,new Date().toISOString(),true);$('replyContent').value='';$('status').textContent='';$('chatBody').scrollTop=$('chatBody').scrollHeight;}
   catch(e){$('status').textContent='Impossible d’envoyer la réponse.';}
   finally{$('sendReply').disabled=false;}
 });
 $('deleteBtn').addEventListener('click',async()=>{$('messageMenu').hidden=true;if(!confirm('Supprimer définitivement ce message ?'))return;$('deleteBtn').disabled=true;try{await WebStoreDevAPI.deleteMessage(id);back();}catch(e){$('status').textContent='Impossible de supprimer ce message.';$('deleteBtn').disabled=false;}});
})();
</script><script src="../js/dev-shell.js"></script></body></html>
