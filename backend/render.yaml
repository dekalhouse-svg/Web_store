services:
  - type: web
    name: webstore-backend
    env: python
    buildCommand: pip install -r requirements.txt && python manage.py migrate && python manage.py seed_categories && python manage.py ensure_founder
    startCommand: gunicorn webstore.wsgi:application
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "false"
      - key: REQUIRE_EMAIL_VERIFICATION
        value: "true"
      - key: DJANGO_ALLOWED_HOSTS
        value: "web-store-back.onrender.com"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://web-store-74me.onrender.com,https://web-store-dev.onrender.com,https://store-by-dekal.onrender.com"
      - key: DATABASE_URL
        fromDatabase:
          name: webstore-db
          property: connectionString

databases:
  - name: webstore-db
